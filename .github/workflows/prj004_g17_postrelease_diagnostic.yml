name: PRJ-004 G17 Post-Release Diagnostic

on:
  push:
    branches:
      - prj-004/g17-postrelease-diagnostic

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PROD_SHA: 913a1cfb711ac6fe53a7a681c23682e1e9ea9b0d
      PROD_URL: https://greenscape2024.github.io/C3L-Dashboard/
      PROD_RUNTIME_URL: https://c3l-dashboard-3-0-g16-re-entry-candidate-lsknko.v2.appdeploy.ai/
      SOURCE_URL: https://c3l-dashboard-prj-004-g04-runtime-candidate-j11l3t.v2.appdeploy.ai/
      SOURCE_VERSION: '1787752423174'
      EVIDENCE_BRANCH: prj-004/g08-development-reentry
      EVIDENCE_PATH: .c3l/dashboard3/G12_APPDEPLOY_RUNTIME_EVIDENCE.v1.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact production preflight
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/${EVIDENCE_BRANCH}:refs/remotes/origin/${EVIDENCE_BRANCH}
          test "$(git rev-parse refs/remotes/origin/main)" = "${PROD_SHA}"
          echo G17_DIAG_MAIN_SHA=PASS
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Refresh fresh 9-of-9 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g17diag
          git checkout -B "${EVIDENCE_BRANCH}" "refs/remotes/origin/${EVIDENCE_BRANCH}"
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs');
          const authorities=[['PRJ004-AUTH-BASELINE-INTEGRITY-001','baseline_integrity','ORGANIZATOR_CONTROL_PLANE',300],['PRJ004-AUTH-DRIFT-001','drift','ORGANIZATOR_CONTROL_PLANE',300],['PRJ004-AUTH-SECURITY-RBAC-001','security_rbac','SECURITY_CONTROL_PLANE',60],['PRJ004-AUTH-MODULE-GRAPH-001','module_registry_graph','ORGANIZATOR_CONTROL_PLANE',300],['PRJ004-AUTH-ROUTING-001','routing','ORGANIZATOR_CONTROL_PLANE',60],['PRJ004-AUTH-SNAPSHOT-001','snapshots','ORGANIZATOR_CONTROL_PLANE',0],['PRJ004-AUTH-ALERTS-001','alerts','ALERT_EVENT_CONTROL_PLANE',60],['PRJ004-AUTH-BOUNDARY-001','organizator_agent_boundary','DUAL_BOUNDARY_CONTROL_ORGANIZATOR_AGENT',300],['PRJ004-AUTH-EVALUATION-HISTORY-001','evaluation_history','AGENT_EVALUATION_CONTROL_PLANE',300]];
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();await p.goto(process.env.SOURCE_URL,{waitUntil:'domcontentloaded',timeout:30000});await p.waitForFunction(()=>document.querySelector('#preflightState')?.textContent==='PASS'&&document.querySelector('#preflightSources')?.textContent==='9 / 9'&&document.querySelector('#preflightSecurity')?.textContent==='Security negatives: PASS',null,{timeout:30000});const st=await p.evaluate(()=>{const s=document.querySelector('#preflightState'),c=document.querySelector('#preflightSources');return{gate_pass:s?.textContent==='PASS',verified_count:Number((c?.textContent||'0 / 9').split('/')[0].trim()),total_sources:Number((c?.textContent||'0 / 9').split('/')[1].trim()),schema_pass:s?.textContent==='PASS',freshness_pass:s?.textContent==='PASS',zero_false_verified:s?.textContent==='PASS',readback_hash:s?.getAttribute('data-readback-hash')||'',anonymous_session_denied:s?.getAttribute('data-session-denied')==='true',c2_denied:s?.getAttribute('data-c2-denied')==='true'}});if(!(st.gate_pass&&st.verified_count===9&&st.total_sources===9&&st.schema_pass&&st.freshness_pass&&st.zero_false_verified&&/^[a-f0-9]{64}$/.test(st.readback_hash)&&st.anonymous_session_denied&&st.c2_denied))throw new Error('SOURCE_NOT_ACCEPTABLE');const collected_at=new Date().toISOString();const source_projection=authorities.map(([authority_id,domain,owner,sla])=>({authority_id,domain,owner,freshness_sla_seconds:sla,verification_state:'VERIFIED_AT_COLLECTION',schema_pass:true,freshness_pass:true,evidence_scope:'AGGREGATE_9_OF_9',evidence_reference:st.readback_hash,permission_state:'READ_ONLY_PUBLIC_AGGREGATE'}));const out={project_id:'PRJ-004',gate:'G-PRJ004-17-DIAGNOSTIC',artifact:'APPDEPLOY_RUNTIME_EVIDENCE_BRIDGE',version:'1.0',status:'COLLECTED_FROM_AUTHORITATIVE_RUNTIME',collected_at,bridge_freshness_limit_seconds:300,source_runtime:{app_id:'c3l-dashboard-prj-004-g04-runtime-candidate-j11l3t',url:process.env.SOURCE_URL,snapshot_version:process.env.SOURCE_VERSION,transport:'OFFICIAL_APPDEPLOY_CLIENT_API_VIA_RENDERED_RUNTIME'},selftest:st,source_projection,collector:{workflow:'PRJ-004 G17 Post-Release Diagnostic',run_id:process.env.GITHUB_RUN_ID},production_promotion:true,production_sha:process.env.PROD_SHA};fs.writeFileSync(process.env.EVIDENCE_PATH,JSON.stringify(out,null,2)+'\n');fs.writeFileSync('/tmp/g17diag/fresh.json',JSON.stringify({collected_at,readback_hash:st.readback_hash},null,2)+'\n');await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${EVIDENCE_PATH}"
          test "$(git diff --cached --name-only)" = "${EVIDENCE_PATH}"
          git commit -m "PRJ-004 G17: refresh evidence for post-release diagnostic"
          EVIDENCE_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:${EVIDENCE_BRANCH}"
          echo "EVIDENCE_SHA=${EVIDENCE_SHA}" >> "$GITHUB_ENV"
          echo G17_DIAG_FRESH_9_OF_9=PASS
      - name: Capture production and runtime states without PASS assumption
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs');
          async function capture(b,url,label){const ctx=await b.newContext();const p=await ctx.newPage();let navError=null;try{await p.goto(url,{waitUntil:'networkidle',timeout:30000})}catch(e){navError=String(e)};await p.waitForSelector('[data-testid="adapter-state"]',{timeout:30000}).catch(()=>{});const text=async id=>{try{return (await p.getByTestId(id).textContent()||'').trim()}catch{return 'MISSING'}};const out={label,input_url:url,final_url:p.url(),nav_error:navError,adapter:await text('adapter-state'),authority:await text('authority-count'),freshness:await text('bridge-freshness'),rep03:await text('state-REP-03'),sys01:await text('state-SYS-01'),sec01:await text('state-SEC-01'),boundary:await text('boundary-state'),context:await p.locator('p.context').textContent().then(x=>(x||'').trim()).catch(()=> 'MISSING')};await ctx.close();return out}
          (async()=>{const b=await chromium.launch({headless:true});const canonical=await capture(b,process.env.PROD_URL,'canonical');const hostile=await capture(b,process.env.PROD_URL+'?g17diag=1&next=https%3A%2F%2Fevil.example%2F#NO_FORWARD','hostile');const direct=await capture(b,process.env.PROD_RUNTIME_URL,'direct_runtime');const result={status:'DIAGNOSTIC_CAPTURED',production_sha:process.env.PROD_SHA,evidence_sha:process.env.EVIDENCE_SHA,canonical,hostile,direct};fs.writeFileSync('/tmp/g17diag/result.json',JSON.stringify(result,null,2)+'\n');for(const x of [canonical,hostile,direct])console.log('G17_DIAG_'+x.label.toUpperCase()+'='+JSON.stringify(x));await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: prj004-g17-postrelease-diagnostic-${{ github.run_id }}
          path: /tmp/g17diag/
          if-no-files-found: error
          retention-days: 30
