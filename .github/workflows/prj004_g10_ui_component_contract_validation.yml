name: PRJ-004 G10 UI Component Contract Validation

on:
  push:
    branches: [ "prj-004/g08-development-reentry" ]
    paths:
      - ".c3l/dashboard3/G10_G09_WIREFRAME_ACCEPTANCE.v1.json"
      - ".c3l/dashboard3/G10_UI_COMPONENT_CONTRACT.v0.1.json"
      - ".c3l/dashboard3/G08_CURRENT_SLICE_MANIFEST.v1.json"
      - "docs/dashboard3/G10_UI_COMPONENT_CONTRACT_CANDIDATE.md"
      - ".github/workflows/prj004_g10_ui_component_contract_validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-g10:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact G09 acceptance inputs
        run: |
          python - <<'PY'
          import json, subprocess
          a=json.load(open('.c3l/dashboard3/G10_G09_WIREFRAME_ACCEPTANCE.v1.json',encoding='utf-8'))
          assert a['status']=='ACCEPTED_AS_COMPONENT_CONTRACT_INPUT'
          assert a['locked_baseline_sha']=='b7d46b80a72772ebc16bc557500eb63916a1d63c'
          assert a['accepted_g09_candidate_sha']=='c81e7581477ac8e9eeab0fe439400a9a71a5f87a'
          ia=a['accepted_inputs']['information_architecture']
          wf=a['accepted_inputs']['lite_full_wireframe']
          assert ia['blob_sha']=='866a5abe9818daae9177df43940944b98f9a4184'
          assert wf['blob_sha']=='fc203bf6487ca3c1d364abfed7a88396a8881e59'
          def blob(path):
              return subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()
          assert blob(ia['path'])==ia['blob_sha']
          assert blob(wf['path'])==wf['blob_sha']
          assert a['accepted_invariants']['full_metric_coverage']=='45_OF_45'
          assert a['accepted_invariants']['lite_full_semantic_parity'] is True
          assert a['accepted_invariants']['organizer_agent_hard_boundary'] is True
          assert a['acceptance_limits']['production_component_implementation_approved'] is False
          assert a['acceptance_limits']['production_deploy_approved'] is False
          print('G10_G09_EXACT_INPUT_ACCEPTANCE=PASS')
          PY

      - name: Validate reusable component contract
        run: |
          python - <<'PY'
          import json
          c=json.load(open('.c3l/dashboard3/G10_UI_COMPONENT_CONTRACT.v0.1.json',encoding='utf-8'))
          m=json.load(open('.c3l/dashboard3/G08_CURRENT_SLICE_MANIFEST.v1.json',encoding='utf-8'))
          assert c['status']=='CANDIDATE_NOT_IMPLEMENTATION'
          assert c['baseline_sha']=='b7d46b80a72772ebc16bc557500eb63916a1d63c'
          assert c['accepted_g09_input_sha']=='c81e7581477ac8e9eeab0fe439400a9a71a5f87a'
          rules=c['global_component_rules']
          for k in ['direct_authoritative_source_fetch','shadow_ssot','state_recomputation_in_component','severity_recomputation_in_component','freshness_recomputation_in_component','evidence_substitution_in_component','unknown_to_pass_coercion','c2_mutation_actions','cross_owner_write']:
              assert rules[k]=='FORBIDDEN'
          required_ids={
            'CMP-STATUS-CARD','CMP-EVIDENCE-DRAWER','CMP-MODULE-GRAPH','CMP-ALERT-ROW',
            'CMP-MODE-SWITCH','CMP-OWNERSHIP-BADGE','CMP-OA-BOUNDARY'
          }
          components=c['components']
          assert len(components)==7
          assert {x['component_id'] for x in components}==required_ids
          for x in components:
              assert x.get('source_binding')
              assert x.get('fail_closed_behavior')
              assert 'execute_c2' in x.get('forbidden_interactions',[])
          graph=next(x for x in components if x['component_id']=='CMP-MODULE-GRAPH')
          assert set(graph['edge_contract']['allowed_relation_types'])=={'DEPENDS_ON','ROUTES_TO','READS_FROM','EVALUATES','REPORTS_TO'}
          boundary=next(x for x in components if x['component_id']=='CMP-OA-BOUNDARY')
          assert boundary['metric_binding']=='UNI-03'
          assert 'cross_lane_write' in boundary['forbidden_interactions']
          mode=next(x for x in components if x['component_id']=='CMP-MODE-SWITCH')
          assert 'recompute_metric' in mode['forbidden_interactions']
          assert c['acceptance']['component_count']==7
          assert c['acceptance']['all_components_source_bound'] is True
          assert c['acceptance']['all_components_fail_closed'] is True
          assert c['acceptance']['all_components_c2_free'] is True
          assert c['acceptance']['lite_full_semantic_parity_preserved'] is True
          assert c['acceptance']['organizer_agent_boundary_preserved'] is True
          assert c['acceptance']['production_promotion'] is False
          assert m['slice_id']=='G10-UI-COMPONENT-CONTRACT-001'
          assert m['slice_type']=='WIREFRAME_ACCEPTANCE_UI_COMPONENT_CONTRACT'
          assert m['promotion_requested'] is False
          assert m['protected_domains_touched']==[]
          print('G10_COMPONENT_COUNT=7_PASS')
          print('G10_SOURCE_BINDING=PASS')
          print('G10_FAIL_CLOSED=PASS')
          print('G10_C2_FREE=PASS')
          print('G10_LITE_FULL_PARITY=PASS')
          print('G10_OA_BOUNDARY=PASS')
          PY

      - name: Human-readable contract present
        run: |
          test -s docs/dashboard3/G10_UI_COMPONENT_CONTRACT_CANDIDATE.md
          grep -Fq 'OWNERSHIP BOUNDARY — VIEW ONLY' docs/dashboard3/G10_UI_COMPONENT_CONTRACT_CANDIDATE.md
          grep -Fq 'NOT IMPLEMENTED' docs/dashboard3/G10_UI_COMPONENT_CONTRACT_CANDIDATE.md
          echo 'G10_HUMAN_CONTRACT=PASS'

      - name: Enforce no production or protected-surface mutation
        run: |
          git diff --name-only b7d46b80a72772ebc16bc557500eb63916a1d63c...${GITHUB_SHA} > /tmp/g10-delta.txt
          for p in \
            index.html \
            .c3l/dashboard3/SECURITY_AUTH_CONTRACT.v1.json \
            .c3l/dashboard3/AUTH_ADAPTER_INTERFACE.v1.js \
            .c3l/dashboard3/SOURCE_AUTHORITY_REGISTRY.v1.json \
            .c3l/dashboard3/SOURCE_SCHEMAS.v1.json \
            .c3l/dashboard3/RUNTIME_BINDING_STATUS.v1.json \
            .c3l/dashboard3/G06A_PRODUCTION_ENTRYPOINT_CONTRACT.v1.json; do
              if grep -Fxq "$p" /tmp/g10-delta.txt; then
                echo "G10 forbidden protected-surface mutation: $p" >&2
                exit 1
              fi
          done
          echo 'G10_PRODUCTION_SURFACE_MUTATION=0_PASS'
          echo 'G10_IMPLEMENTATION_STATUS=SPEC_ONLY_PASS'
