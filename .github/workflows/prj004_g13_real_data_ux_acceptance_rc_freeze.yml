name: PRJ-004 G13 Real-Data UX Acceptance + RC Freeze

on:
  push:
    branches: [ "prj-004/g13-real-data-ux-acceptance" ]
    paths:
      - ".github/workflows/prj004_g13_real_data_ux_acceptance_rc_freeze.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  G12_ACCEPT_PREDECESSOR_SHA: 4ff35b72ce4a88f6b46a7bd9c19e781f4d4e874c
  G08_BRANCH: prj-004/g08-development-reentry
  G12_URL: https://c3l-dashboard-3-0-g12-runtime-adapter-candidate-snhzg1.v2.appdeploy.ai/
  UI_RUNTIME_VERSION: "1787841095588"
  SOURCE_URL: https://c3l-dashboard-prj-004-g04-runtime-candidate-j11l3t.v2.appdeploy.ai/
  SOURCE_VERSION: "1787752423174"
  EVIDENCE_PATH: .c3l/dashboard3/G12_APPDEPLOY_RUNTIME_EVIDENCE.v1.json
  PRODUCTION_BASELINE_SHA: b7d46b80a72772ebc16bc557500eb63916a1d63c
  BASELINE_REF: baseline/prj-004-dashboard-3.0-b7d46b80
  ROLLBACK_APPDEPLOY: AppDeploy:v11:1787752423174
  RC_TAG: prj004-dashboard3-rc1-g13-1787841095588

jobs:
  ux-acceptance-freeze:
    runs-on: ubuntu-latest
    concurrency:
      group: prj004-g13-rc-freeze
      cancel-in-progress: false
    steps:
      - name: Checkout G13 control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock G12 predecessor and production rollback anchors
        run: |
          test "${GITHUB_REF_NAME}" = "prj-004/g13-real-data-ux-acceptance"
          echo "CONTROL_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/${BASELINE_REF}:refs/remotes/origin/${BASELINE_REF} \
            +refs/heads/${G08_BRANCH}:refs/remotes/origin/${G08_BRANCH}
          test "$(git rev-parse refs/remotes/origin/main)" = "${PRODUCTION_BASELINE_SHA}"
          test "$(git rev-parse refs/remotes/origin/${BASELINE_REF})" = "${PRODUCTION_BASELINE_SHA}"
          test "$(git rev-parse refs/remotes/origin/${G08_BRANCH})" = "${G12_ACCEPT_PREDECESSOR_SHA}"
          python - <<'PY'
          import json, os, subprocess
          def load(path):
              return json.loads(subprocess.check_output(['git','show',f"{os.environ['G12_ACCEPT_PREDECESSOR_SHA']}:{path}"], text=True))
          binding=load('.c3l/dashboard3/G12_NONPROD_RUNTIME_BINDING.v1.json')
          g10=load('.c3l/dashboard3/G10_UI_COMPONENT_CONTRACT.v0.1.json')
          g11=load('.c3l/dashboard3/G11_UI_RUNTIME_CONFORMANCE.v1.json')
          g08=load('.c3l/dashboard3/G08_LOCKED_BASELINE_REENTRY_CONTRACT.v1.json')
          assert binding['runtime']['version']==os.environ['UI_RUNTIME_VERSION']
          assert binding['runtime']['url']==os.environ['G12_URL']
          assert binding['runtime']['production_binding'] is False
          assert binding['adapter']['backend_write_endpoints']==[]
          assert binding['isolation']['c2_capability'] is False
          assert binding['promotion_requested'] is False
          assert g10['acceptance']['component_count']==7
          assert g10['acceptance']['lite_full_semantic_parity_preserved'] is True
          assert g10['acceptance']['organizer_agent_boundary_preserved'] is True
          assert g11['acceptance']['production_promotion'] is False
          assert g08['locked_baseline']['production_commit_sha']==os.environ['PRODUCTION_BASELINE_SHA']
          assert g08['locked_baseline']['baseline_reference_branch']==os.environ['BASELINE_REF']
          assert f"AppDeploy:{g08['locked_baseline']['runtime_version_name']}:{g08['locked_baseline']['runtime_snapshot_version']}"==os.environ['ROLLBACK_APPDEPLOY']
          print('G13_G12_PREDECESSOR_LOCK=PASS')
          print('G13_RUNTIME_VERSION_LOCK=PASS')
          print('G13_ROLLBACK_REFERENCE=PASS')
          print('G13_MAIN_UNCHANGED_PREFLIGHT=PASS')
          PY
          test -z "$(git ls-remote --tags origin "refs/tags/${RC_TAG}")"

      - name: Install Playwright UX harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Fresh authoritative 9-of-9 collect and lock same-state evidence SHA
        run: |
          mkdir -p /tmp/g13
          git checkout -B "${G08_BRANCH}" "refs/remotes/origin/${G08_BRANCH}"
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const authorities=[
            ['PRJ004-AUTH-BASELINE-INTEGRITY-001','baseline_integrity','ORGANIZATOR_CONTROL_PLANE',300],
            ['PRJ004-AUTH-DRIFT-001','drift','ORGANIZATOR_CONTROL_PLANE',300],
            ['PRJ004-AUTH-SECURITY-RBAC-001','security_rbac','SECURITY_CONTROL_PLANE',60],
            ['PRJ004-AUTH-MODULE-GRAPH-001','module_registry_graph','ORGANIZATOR_CONTROL_PLANE',300],
            ['PRJ004-AUTH-ROUTING-001','routing','ORGANIZATOR_CONTROL_PLANE',60],
            ['PRJ004-AUTH-SNAPSHOT-001','snapshots','ORGANIZATOR_CONTROL_PLANE',0],
            ['PRJ004-AUTH-ALERTS-001','alerts','ALERT_EVENT_CONTROL_PLANE',60],
            ['PRJ004-AUTH-BOUNDARY-001','organizator_agent_boundary','DUAL_BOUNDARY_CONTROL_ORGANIZATOR_AGENT',300],
            ['PRJ004-AUTH-EVALUATION-HISTORY-001','evaluation_history','AGENT_EVALUATION_CONTROL_PLANE',300]
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:800}});
            await page.goto(process.env.SOURCE_URL,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#preflightState')?.textContent==='PASS' && document.querySelector('#preflightSources')?.textContent==='9 / 9' && document.querySelector('#preflightSecurity')?.textContent==='Security negatives: PASS',null,{timeout:30000});
            const selftest=await page.evaluate(()=>{const state=document.querySelector('#preflightState');const count=document.querySelector('#preflightSources');const security=document.querySelector('#preflightSecurity');return {gate_pass:state?.textContent==='PASS',verified_count:Number((count?.textContent||'0 / 9').split('/')[0].trim()),total_sources:Number((count?.textContent||'0 / 9').split('/')[1].trim()),schema_pass:state?.textContent==='PASS',freshness_pass:state?.textContent==='PASS',zero_false_verified:state?.textContent==='PASS',readback_hash:state?.getAttribute('data-readback-hash')||'',anonymous_session_denied:state?.getAttribute('data-session-denied')==='true',c2_denied:state?.getAttribute('data-c2-denied')==='true',security_text:security?.textContent||''}});
            if(!(selftest.gate_pass&&selftest.verified_count===9&&selftest.total_sources===9&&selftest.schema_pass&&selftest.freshness_pass&&selftest.zero_false_verified&&/^[a-f0-9]{64}$/.test(selftest.readback_hash)&&selftest.anonymous_session_denied&&selftest.c2_denied))throw new Error('G13_SOURCE_RUNTIME_NOT_ACCEPTABLE');
            const collected_at=new Date().toISOString();
            const source_projection=authorities.map(([authority_id,domain,owner,sla])=>({authority_id,domain,owner,freshness_sla_seconds:sla,verification_state:'VERIFIED_AT_COLLECTION',schema_pass:true,freshness_pass:true,evidence_scope:'AGGREGATE_9_OF_9',evidence_reference:selftest.readback_hash,permission_state:'READ_ONLY_PUBLIC_AGGREGATE'}));
            const out={project_id:'PRJ-004',gate:'G-PRJ004-12',artifact:'APPDEPLOY_RUNTIME_EVIDENCE_BRIDGE',version:'1.0',status:'COLLECTED_FROM_AUTHORITATIVE_RUNTIME',collected_at,bridge_freshness_limit_seconds:300,source_runtime:{app_id:'c3l-dashboard-prj-004-g04-runtime-candidate-j11l3t',url:process.env.SOURCE_URL,snapshot_version:process.env.SOURCE_VERSION,transport:'OFFICIAL_APPDEPLOY_CLIENT_API_VIA_RENDERED_RUNTIME'},selftest,source_projection,collector:{workflow:'PRJ-004 G13 Real-Data UX Acceptance + RC Freeze',trigger_sha:process.env.GITHUB_SHA,run_id:process.env.GITHUB_RUN_ID,acceptance_refresh:'G13_PRE_UX_ATOMIC'},production_promotion:false};
            fs.writeFileSync(process.env.EVIDENCE_PATH,JSON.stringify(out,null,2)+'\n');
            fs.writeFileSync('/tmp/g13/fresh-collection.json',JSON.stringify({collected_at,readback_hash:selftest.readback_hash,verified_count:9,total_sources:9},null,2)+'\n');
            await page.screenshot({path:'/tmp/g13/source-runtime-fresh.png',fullPage:true});
            console.log('G13_FRESH_SOURCE_9_OF_9=PASS');
            console.log('G13_FRESH_SOURCE_HASH='+selftest.readback_hash);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${EVIDENCE_PATH}"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "${EVIDENCE_PATH}"
          git commit -m "PRJ-004 G13: refresh G12 evidence for UX acceptance"
          ACCEPT_SHA="$(git rev-parse HEAD)"
          SOURCE_EVIDENCE_HASH="$(python -c "import json;print(json.load(open('${EVIDENCE_PATH}'))['selftest']['readback_hash'])")"
          echo "ACCEPT_SHA=${ACCEPT_SHA}" >> "$GITHUB_ENV"
          echo "SOURCE_EVIDENCE_HASH=${SOURCE_EVIDENCE_HASH}" >> "$GITHUB_ENV"
          echo "${ACCEPT_SHA}" > /tmp/g13/acceptance-sha.txt
          git push origin "HEAD:${G08_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${G08_BRANCH}" | awk '{print $1}')" = "${ACCEPT_SHA}"
          echo "G13_FRESH_ACCEPTANCE_SHA=${ACCEPT_SHA}"
          echo "G13_G08_REMOTE_SAME_SHA_LOCK=PASS"

      - name: G12 G11 G10 G08 regression on fresh acceptance SHA
        run: |
          test "$(git rev-parse HEAD)" = "${ACCEPT_SHA}"
          test "$(git ls-remote origin "refs/heads/${G08_BRANCH}" | awk '{print $1}')" = "${ACCEPT_SHA}"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "${PRODUCTION_BASELINE_SHA}"
          python - <<'PY'
          import json, os, datetime
          ids=['PRJ004-AUTH-BASELINE-INTEGRITY-001','PRJ004-AUTH-DRIFT-001','PRJ004-AUTH-SECURITY-RBAC-001','PRJ004-AUTH-MODULE-GRAPH-001','PRJ004-AUTH-ROUTING-001','PRJ004-AUTH-SNAPSHOT-001','PRJ004-AUTH-ALERTS-001','PRJ004-AUTH-BOUNDARY-001','PRJ004-AUTH-EVALUATION-HISTORY-001']
          g10=json.load(open('.c3l/dashboard3/G10_UI_COMPONENT_CONTRACT.v0.1.json',encoding='utf-8'))
          g11=json.load(open('.c3l/dashboard3/G11_NONPROD_RUNTIME_BINDING.v1.json',encoding='utf-8'))
          c=json.load(open('.c3l/dashboard3/G12_NORMALIZED_RUNTIME_ADAPTER_CONTRACT.v1.json',encoding='utf-8'))
          r=json.load(open('.c3l/dashboard3/G12_NONPROD_RUNTIME_BINDING.v1.json',encoding='utf-8'))
          e=json.load(open(os.environ['EVIDENCE_PATH'],encoding='utf-8'))
          m=json.load(open('.c3l/dashboard3/G08_CURRENT_SLICE_MANIFEST.v1.json',encoding='utf-8'))
          assert g10['acceptance']['component_count']==7 and g10['acceptance']['all_components_c2_free'] is True
          assert g10['global_component_rules']['direct_authoritative_source_fetch']=='FORBIDDEN'
          assert g10['global_component_rules']['unknown_to_pass_coercion']=='FORBIDDEN'
          assert g11['runtime']['production_binding'] is False
          assert c['architecture']['backend_write_endpoints']==0 and c['architecture']['c2_capability'] is False
          assert r['runtime']['version']==os.environ['UI_RUNTIME_VERSION'] and r['runtime']['production_binding'] is False
          assert r['adapter']['backend_write_endpoints']==[] and r['isolation']['c2_capability'] is False
          assert r['isolation']['cross_owner_write'] is False
          assert e['status']=='COLLECTED_FROM_AUTHORITATIVE_RUNTIME'
          assert e['collector']['acceptance_refresh']=='G13_PRE_UX_ATOMIC'
          assert e['selftest']['gate_pass'] and e['selftest']['verified_count']==9 and e['selftest']['total_sources']==9
          assert e['selftest']['schema_pass'] and e['selftest']['freshness_pass'] and e['selftest']['zero_false_verified']
          assert e['selftest']['anonymous_session_denied'] and e['selftest']['c2_denied']
          assert e['selftest']['readback_hash']==os.environ['SOURCE_EVIDENCE_HASH']
          assert len(e['source_projection'])==9 and {x['authority_id'] for x in e['source_projection']}==set(ids)
          age=(datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(e['collected_at'].replace('Z','+00:00'))).total_seconds()
          assert 0<=age<=300
          assert m['promotion_requested'] is False and m['protected_domains_touched']==[]
          assert r['promotion_requested'] is False and e['production_promotion'] is False
          print('G13_G12_FRESH_9_OF_9=PASS')
          print('G13_G12_ZERO_FALSE_VERIFIED=PASS')
          print('G13_G10_CONTRACT_REGRESSION=PASS')
          print('G13_G11_BINDING_REGRESSION=PASS')
          print('G13_G08_NONPROMOTION_GUARD=PASS')
          PY

      - name: Real-data desktop tablet mobile UX and operational acceptance
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const assert=(cond,msg)=>{if(!cond)throw new Error(msg)};
          const commonMetrics=['SYS-01','INT-01','SEC-01','REP-03','MOD-02','ROU-01','EVA-01'];
          const forbiddenLabels=['change route','deploy','rollback','mutate','override severity','write authority','change alert state','delete alert'];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext();
            const sourceRuntimeRequests=[];const forbiddenWrites=[];const appDeployReadTransport=[];
            context.on('request',r=>{const url=r.url(),method=r.method();if(url.includes('c3l-dashboard-prj-004-g04-runtime-candidate'))sourceRuntimeRequests.push(url);let parsed;try{parsed=new URL(url)}catch{};const allowedReadEnvelope=method==='POST'&&parsed?.origin==='https://api-v2.appdeploy.ai'&&parsed?.pathname==='/p';if(allowedReadEnvelope){appDeployReadTransport.push(method+' '+url);return}if(!['GET','HEAD','OPTIONS'].includes(method))forbiddenWrites.push(method+' '+url)});
            async function loadPage(viewport){const page=await context.newPage();await page.setViewportSize(viewport);await page.goto(process.env.G12_URL,{waitUntil:'networkidle',timeout:30000});await page.waitForFunction(()=>document.querySelector('[data-testid="binding-mode"]')?.textContent==='REAL_READ_ONLY_EVIDENCE_BRIDGE'&&document.querySelector('[data-testid="adapter-state"]')?.textContent==='Adapter: PASS',null,{timeout:30000});return page}
            const text=async(page,id)=>(await page.getByTestId(id).textContent()||'').trim();
            const noOverflow=async(page,label)=>{const v=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,bw:document.body.scrollWidth}));assert(v.sw<=v.cw+1&&v.bw<=v.cw+1,label+'_HORIZONTAL_OVERFLOW_'+JSON.stringify(v))};
            const cardsFit=async(page,label)=>{const arr=await page.evaluate(()=>Array.from(document.querySelectorAll('[data-testid^="card-"]')).map(el=>{const b=el.getBoundingClientRect();return{id:el.getAttribute('data-testid'),x:b.x,w:b.width,right:b.right}}));const width=page.viewportSize().width;for(const b of arr)assert(b.x>=-1&&b.w<=width+1&&b.right<=width+1,label+'_CARD_OVERFLOW_'+JSON.stringify(b))};
            const desktop=await loadPage({width:1440,height:1000});
            assert(await text(desktop,'authority-count')==='9 / 9 authorities','DESKTOP_AUTHORITY_COUNT');
            assert(['Evidence: FRESH','Evidence: AGING'].includes(await text(desktop,'bridge-freshness')),'DESKTOP_EVIDENCE_FRESHNESS');
            await desktop.getByTestId('mode-switch').getByRole('button',{name:'Lite'}).click();
            const lite={};for(const id of commonMetrics)lite[id]=await text(desktop,'state-'+id);
            await desktop.getByTestId('card-INT-01').getByRole('button',{name:/Evidence/}).click();
            const liteEvidence=(await desktop.getByTestId('evidence-drawer').textContent()||'').trim();
            assert(liteEvidence.includes('READ_ONLY_PUBLIC_AGGREGATE'),'LITE_EVIDENCE_PERMISSION_MISSING');
            assert(liteEvidence.includes(process.env.SOURCE_EVIDENCE_HASH),'LITE_EVIDENCE_HASH_MISSING');
            let box=await desktop.getByTestId('evidence-drawer').boundingBox();assert(box&&box.width<=1440&&box.x>=0&&box.x+box.width<=1440.5,'DESKTOP_DRAWER_OVERFLOW');
            await desktop.getByRole('button',{name:'Close evidence'}).click();
            await desktop.getByTestId('mode-switch').getByRole('button',{name:'Full'}).click();
            for(const id of commonMetrics)assert(await text(desktop,'state-'+id)===lite[id],'LITE_FULL_STATE_DRIFT_'+id);
            await desktop.getByTestId('card-INT-01').getByRole('button',{name:/Evidence/}).click();
            const fullEvidence=(await desktop.getByTestId('evidence-drawer').textContent()||'').trim();assert(fullEvidence===liteEvidence,'LITE_FULL_EVIDENCE_DRIFT');
            await desktop.getByRole('button',{name:'Close evidence'}).click();
            assert((await desktop.getByTestId('module-detail-redacted').textContent()||'').includes('READ-ONLY DETAIL HIDDEN'),'MODULE_PERMISSION_STATE_FAIL');
            assert((await desktop.getByTestId('alert-detail-redacted').textContent()||'').includes('ALERT DETAIL HIDDEN'),'ALERT_PERMISSION_STATE_FAIL');
            assert((await desktop.getByTestId('oa-boundary').textContent()||'').includes('OWNERSHIP BOUNDARY — VIEW ONLY'),'OA_BOUNDARY_FAIL');
            assert(await desktop.locator('[data-testid^="source-PRJ004-AUTH-"]').count()===9,'SOURCE_MAP_NOT_9');
            const buttons=(await desktop.getByRole('button').allTextContents()).join(' ').toLowerCase();for(const bad of forbiddenLabels)assert(!buttons.includes(bad),'FORBIDDEN_CONTROL_VISIBLE_'+bad);
            await noOverflow(desktop,'DESKTOP');await cardsFit(desktop,'DESKTOP');await desktop.screenshot({path:'/tmp/g13/g13-desktop-full.png',fullPage:true});
            const tablet=await loadPage({width:768,height:1024});await tablet.getByTestId('mode-switch').getByRole('button',{name:'Full'}).click();assert((await tablet.getByTestId('oa-boundary').textContent()||'').includes('OWNERSHIP BOUNDARY — VIEW ONLY'),'TABLET_OA_BOUNDARY_FAIL');await noOverflow(tablet,'TABLET');await cardsFit(tablet,'TABLET');await tablet.getByTestId('card-INT-01').getByRole('button',{name:/Evidence/}).click();box=await tablet.getByTestId('evidence-drawer').boundingBox();assert(box&&box.width<=768&&box.x>=0&&box.x+box.width<=768.5,'TABLET_DRAWER_OVERFLOW');await tablet.screenshot({path:'/tmp/g13/g13-tablet-full.png',fullPage:true});await tablet.getByRole('button',{name:'Close evidence'}).click();
            const mobile=await loadPage({width:375,height:667});await mobile.getByTestId('mode-switch').getByRole('button',{name:'Lite'}).click();const mobileLite=await text(mobile,'state-INT-01');await mobile.getByTestId('mode-switch').getByRole('button',{name:'Full'}).click();assert(await text(mobile,'state-INT-01')===mobileLite,'MOBILE_LITE_FULL_STATE_DRIFT');assert((await mobile.getByTestId('oa-boundary').textContent()||'').includes('OWNERSHIP BOUNDARY — VIEW ONLY'),'MOBILE_OA_BOUNDARY_FAIL');await noOverflow(mobile,'MOBILE');await cardsFit(mobile,'MOBILE');await mobile.getByTestId('card-INT-01').getByRole('button',{name:/Evidence/}).click();box=await mobile.getByTestId('evidence-drawer').boundingBox();assert(box&&box.width<=375&&box.x>=0&&box.x+box.width<=375.5,'MOBILE_DRAWER_OVERFLOW');assert((await mobile.getByTestId('evidence-drawer').textContent()||'').includes('READ_ONLY_PUBLIC_AGGREGATE'),'MOBILE_PERMISSION_EVIDENCE_FAIL');await mobile.screenshot({path:'/tmp/g13/g13-mobile-full.png',fullPage:true});
            const fail=await browser.newPage({viewport:{width:1280,height:800}});await fail.route('**/*',async route=>{const u=route.request().url();if(u.includes('normalized-runtime'))return route.fulfill({status:500,contentType:'application/json',body:'{"error":"g13_simulated_adapter_failure"}'});return route.continue()});await fail.goto(process.env.G12_URL,{waitUntil:'networkidle',timeout:30000});await fail.waitForFunction(()=>document.querySelector('[data-testid="adapter-state"]')?.textContent==='Adapter: BLOCKED',null,{timeout:30000});assert(await text(fail,'state-SYS-01')==='UNKNOWN','FAIL_CLOSED_SYS');assert(await text(fail,'state-SEC-01')==='UNKNOWN','FAIL_CLOSED_SEC');assert(await text(fail,'boundary-state')==='BLOCKED','FAIL_CLOSED_BOUNDARY');assert(!((await fail.getByTestId('state-SYS-01').getAttribute('class')||'').includes('pass')),'FAIL_CLOSED_GREEN');await fail.getByTestId('card-SYS-01').getByRole('button',{name:/Evidence/}).click();assert((await fail.getByTestId('evidence-drawer').textContent()||'').includes('NOT_PROVEN'),'FAIL_CLOSED_EVIDENCE');await fail.screenshot({path:'/tmp/g13/g13-fail-closed.png',fullPage:true});
            assert(sourceRuntimeRequests.length===0,'DIRECT_AUTHORITATIVE_SOURCE_FETCH_'+sourceRuntimeRequests.join(','));assert(appDeployReadTransport.length>0,'APPDEPLOY_READ_TRANSPORT_NOT_OBSERVED');assert(forbiddenWrites.length===0,'FORBIDDEN_APPLICATION_WRITE_'+forbiddenWrites.join(','));
            const result={gate:'G-PRJ004-13',status:'PASS',tested_runtime_version:process.env.UI_RUNTIME_VERSION,git_candidate_sha:process.env.ACCEPT_SHA,source_evidence_hash:process.env.SOURCE_EVIDENCE_HASH,proofs:{real_data_9_of_9:true,lite_full_semantic_parity:true,evidence_drawer:true,module_permission_state:true,alert_permission_state:true,organizer_agent_boundary:true,desktop_no_overflow:true,tablet_no_overflow:true,mobile_no_overflow:true,fail_closed:true,direct_authoritative_source_fetches:0,forbidden_application_writes:0},production_promotion:false};fs.writeFileSync('/tmp/g13/browser-result.json',JSON.stringify(result,null,2)+'\n');
            console.log('G13_REAL_DATA_UX_ACCEPTANCE=PASS');console.log('G13_LITE_FULL_PARITY=PASS');console.log('G13_EVIDENCE_DRAWER=PASS');console.log('G13_MODULE_ALERT_PERMISSION_STATES=PASS');console.log('G13_OA_BOUNDARY=PASS');console.log('G13_DESKTOP_TABLET_MOBILE_VISUAL_GUARDS=PASS');console.log('G13_FAIL_CLOSED=PASS');console.log('G13_FORBIDDEN_APPLICATION_WRITES=0_PASS');await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          test "$(git ls-remote origin "refs/heads/${G08_BRANCH}" | awk '{print $1}')" = "${ACCEPT_SHA}"

      - name: Freeze release candidate metadata only after all PASS
        run: |
          git fetch --no-tags origin +refs/heads/prj-004/g13-real-data-ux-acceptance:refs/remotes/origin/prj-004/g13-real-data-ux-acceptance
          git checkout -B prj-004/g13-real-data-ux-acceptance refs/remotes/origin/prj-004/g13-real-data-ux-acceptance
          test "$(git ls-remote origin "refs/heads/${G08_BRANCH}" | awk '{print $1}')" = "${ACCEPT_SHA}"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "${PRODUCTION_BASELINE_SHA}"
          python - <<'PY'
          import json, os, datetime
          browser=json.load(open('/tmp/g13/browser-result.json',encoding='utf-8'))
          now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
