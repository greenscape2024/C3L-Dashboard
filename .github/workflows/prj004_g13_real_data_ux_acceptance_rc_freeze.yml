          assert f['status']=='RELEASE_CANDIDATE_FROZEN_NONPRODUCTION' and f['source_candidate_sha']==os.environ['ACCEPT_SHA']
          assert f['g12_accepted_predecessor_sha']==os.environ['G12_ACCEPT_PREDECESSOR_SHA']
