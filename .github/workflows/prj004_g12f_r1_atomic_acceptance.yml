name: PRJ-004 G12F-R1 Atomic Same-SHA Acceptance

on:
  push:
    branches: [ "prj-004/g08-development-reentry" ]
    paths:
      - ".github/workflows/prj004_g12f_r1_atomic_acceptance.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  BASELINE_SHA: b7d46b80a72772ebc16bc557500eb63916a1d63c
  BASELINE_REF: baseline/prj-004-dashboard-3.0-b7d46b80
  LOCKED_LAUNCHER_BLOB: 72a271328d0ead519c853a2842d6d565463ca994
  LOCKED_G06A_BLOB: 538782a8b4ef1f052b19abf88d93b96403f2ab8b
  PRODUCTION_URL: https://greenscape2024.github.io/C3L-Dashboard/
  SOURCE_URL: https://c3l-dashboard-prj-004-g04-runtime-candidate-j11l3t.v2.appdeploy.ai/
  SOURCE_VERSION: "1787752423174"
  G12_URL: https://c3l-dashboard-3-0-g12-runtime-adapter-candidate-snhzg1.v2.appdeploy.ai/
  EVIDENCE_PATH: .c3l/dashboard3/G12_APPDEPLOY_RUNTIME_EVIDENCE.v1.json

jobs:
  atomic-acceptance:
    runs-on: ubuntu-latest
    concurrency:
      group: prj004-g12f-r1-atomic
      cancel-in-progress: false
    steps:
      - name: Checkout candidate with full lineage
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight exact branch and production baseline
        run: |
          test "${GITHUB_REF_NAME}" = "prj-004/g08-development-reentry"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/${BASELINE_REF}:refs/remotes/origin/${BASELINE_REF}
          test "$(git rev-parse refs/remotes/origin/main)" = "${BASELINE_SHA}"
          test "$(git rev-parse refs/remotes/origin/${BASELINE_REF})" = "${BASELINE_SHA}"
          git merge-base --is-ancestor "${BASELINE_SHA}" "${GITHUB_SHA}"
          test "$(git rev-parse ${BASELINE_SHA}:index.html)" = "${LOCKED_LAUNCHER_BLOB}"
          test "$(git rev-parse ${BASELINE_SHA}:.c3l/dashboard3/G06A_PRODUCTION_ENTRYPOINT_CONTRACT.v1.json)" = "${LOCKED_G06A_BLOB}"
          echo "G12F_R1_PREFLIGHT_BASELINE=PASS"
          echo "G12F_R1_TRIGGER_SHA=${GITHUB_SHA}"

      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Fresh authoritative 9-of-9 collect
        run: |
          mkdir -p /tmp/g12f-r1
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const authorities = [
            ['PRJ004-AUTH-BASELINE-INTEGRITY-001','baseline_integrity','ORGANIZATOR_CONTROL_PLANE',300],
            ['PRJ004-AUTH-DRIFT-001','drift','ORGANIZATOR_CONTROL_PLANE',300],
            ['PRJ004-AUTH-SECURITY-RBAC-001','security_rbac','SECURITY_CONTROL_PLANE',60],
            ['PRJ004-AUTH-MODULE-GRAPH-001','module_registry_graph','ORGANIZATOR_CONTROL_PLANE',300],
            ['PRJ004-AUTH-ROUTING-001','routing','ORGANIZATOR_CONTROL_PLANE',60],
            ['PRJ004-AUTH-SNAPSHOT-001','snapshots','ORGANIZATOR_CONTROL_PLANE',0],
            ['PRJ004-AUTH-ALERTS-001','alerts','ALERT_EVENT_CONTROL_PLANE',60],
            ['PRJ004-AUTH-BOUNDARY-001','organizator_agent_boundary','DUAL_BOUNDARY_CONTROL_ORGANIZATOR_AGENT',300],
            ['PRJ004-AUTH-EVALUATION-HISTORY-001','evaluation_history','AGENT_EVALUATION_CONTROL_PLANE',300]
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:800}});
            await page.goto(process.env.SOURCE_URL,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#preflightState')?.textContent==='PASS' && document.querySelector('#preflightSources')?.textContent==='9 / 9' && document.querySelector('#preflightSecurity')?.textContent==='Security negatives: PASS',null,{timeout:30000});
            const selftest=await page.evaluate(()=>{const state=document.querySelector('#preflightState');const count=document.querySelector('#preflightSources');const security=document.querySelector('#preflightSecurity');return {gate_pass:state?.textContent==='PASS',verified_count:Number((count?.textContent||'0 / 9').split('/')[0].trim()),total_sources:Number((count?.textContent||'0 / 9').split('/')[1].trim()),schema_pass:state?.textContent==='PASS',freshness_pass:state?.textContent==='PASS',zero_false_verified:state?.textContent==='PASS',readback_hash:state?.getAttribute('data-readback-hash')||'',anonymous_session_denied:state?.getAttribute('data-session-denied')==='true',c2_denied:state?.getAttribute('data-c2-denied')==='true',security_text:security?.textContent||''}});
            if(!(selftest.gate_pass&&selftest.verified_count===9&&selftest.total_sources===9&&selftest.schema_pass&&selftest.freshness_pass&&selftest.zero_false_verified&&/^[a-f0-9]{64}$/.test(selftest.readback_hash)&&selftest.anonymous_session_denied&&selftest.c2_denied))throw new Error('G12F_R1_SOURCE_RUNTIME_NOT_ACCEPTABLE');
            const collected_at=new Date().toISOString();
            const source_projection=authorities.map(([authority_id,domain,owner,sla])=>({authority_id,domain,owner,freshness_sla_seconds:sla,verification_state:'VERIFIED_AT_COLLECTION',schema_pass:true,freshness_pass:true,evidence_scope:'AGGREGATE_9_OF_9',evidence_reference:selftest.readback_hash,permission_state:'READ_ONLY_PUBLIC_AGGREGATE'}));
            const out={project_id:'PRJ-004',gate:'G-PRJ004-12',artifact:'APPDEPLOY_RUNTIME_EVIDENCE_BRIDGE',version:'1.0',status:'COLLECTED_FROM_AUTHORITATIVE_RUNTIME',collected_at,bridge_freshness_limit_seconds:300,source_runtime:{app_id:'c3l-dashboard-prj-004-g04-runtime-candidate-j11l3t',url:process.env.SOURCE_URL,snapshot_version:process.env.SOURCE_VERSION,transport:'OFFICIAL_APPDEPLOY_CLIENT_API_VIA_RENDERED_RUNTIME'},selftest,source_projection,collector:{workflow:'PRJ-004 G12F-R1 Atomic Same-SHA Acceptance',trigger_sha:process.env.GITHUB_SHA,run_id:process.env.GITHUB_RUN_ID,acceptance_refresh:'G12F_R1_ATOMIC'},production_promotion:false};
            fs.writeFileSync(process.env.EVIDENCE_PATH,JSON.stringify(out,null,2)+'\n');
            fs.writeFileSync('/tmp/g12f-r1/collection.json',JSON.stringify({collected_at,readback_hash:selftest.readback_hash,verified_count:selftest.verified_count,total_sources:selftest.total_sources},null,2)+'\n');
            await page.screenshot({path:'/tmp/g12f-r1/source-runtime.png',fullPage:true});
            console.log('G12F_R1_FRESH_COLLECT=PASS');
            console.log('G12F_R1_SOURCE_9_OF_9=PASS');
            console.log('G12F_R1_SOURCE_HASH='+selftest.readback_hash);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Create and lock atomic evidence commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${EVIDENCE_PATH}"
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "${EVIDENCE_PATH}"
          git commit -m "PRJ-004 G12F-R1: atomic fresh acceptance evidence"
          ACCEPT_SHA="$(git rev-parse HEAD)"
          echo "ACCEPT_SHA=${ACCEPT_SHA}" >> "$GITHUB_ENV"
          echo "${ACCEPT_SHA}" > /tmp/g12f-r1/acceptance-sha.txt
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          echo "G12F_R1_ACCEPTANCE_SHA=${ACCEPT_SHA}"

      - name: Publish exact evidence commit to candidate branch without relying on trigger
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "${REMOTE_SHA}" = "${ACCEPT_SHA}"
          test "$(git rev-parse HEAD)" = "${ACCEPT_SHA}"
          echo "G12F_R1_REMOTE_ACCEPTANCE_SHA_LOCK=PASS"

      - name: Validate fresh evidence and G10 G11 G12 contracts on acceptance SHA
        run: |
          test "$(git rev-parse HEAD)" = "${ACCEPT_SHA}"
          python - <<'PY'
          import json, datetime, os
          ids=['PRJ004-AUTH-BASELINE-INTEGRITY-001','PRJ004-AUTH-DRIFT-001','PRJ004-AUTH-SECURITY-RBAC-001','PRJ004-AUTH-MODULE-GRAPH-001','PRJ004-AUTH-ROUTING-001','PRJ004-AUTH-SNAPSHOT-001','PRJ004-AUTH-ALERTS-001','PRJ004-AUTH-BOUNDARY-001','PRJ004-AUTH-EVALUATION-HISTORY-001']
          g10=json.load(open('.c3l/dashboard3/G10_UI_COMPONENT_CONTRACT.v0.1.json',encoding='utf-8'))
          g11=json.load(open('.c3l/dashboard3/G11_NONPROD_RUNTIME_BINDING.v1.json',encoding='utf-8'))
          c=json.load(open('.c3l/dashboard3/G12_NORMALIZED_RUNTIME_ADAPTER_CONTRACT.v1.json',encoding='utf-8'))
          r=json.load(open('.c3l/dashboard3/G12_NONPROD_RUNTIME_BINDING.v1.json',encoding='utf-8'))
          e=json.load(open('.c3l/dashboard3/G12_APPDEPLOY_RUNTIME_EVIDENCE.v1.json',encoding='utf-8'))
          m=json.load(open('.c3l/dashboard3/G08_CURRENT_SLICE_MANIFEST.v1.json',encoding='utf-8'))
          assert g10['acceptance']['component_count']==7
          assert g10['global_component_rules']['input_model']=='NORMALIZED_DASHBOARD_VIEW_MODEL_ONLY'
          assert g10['global_component_rules']['direct_authoritative_source_fetch']=='FORBIDDEN'
          assert g10['global_component_rules']['unknown_to_pass_coercion']=='FORBIDDEN'
          assert g10['acceptance']['all_components_c2_free'] is True
          assert g11['runtime']['version']=='1787837233071' and g11['runtime']['production_binding'] is False
          assert c['architecture']['frontend_api_call_owner']=='src/normalizedAdapter.ts'
          assert c['architecture']['backend_write_endpoints']==0 and c['architecture']['c2_capability'] is False
          assert c['semantic_rules']['authority_verified_at_collection_is_not_metric_value'] is True
          assert c['required_authorities']==ids
          assert r['runtime']['version']=='1787841095588' and r['runtime']['production_binding'] is False
          assert r['adapter']['backend_write_endpoints']==[] and r['isolation']['c2_capability'] is False
          assert r['isolation']['cross_owner_write'] is False and r['isolation']['dormant_realtime_write_scaffold_present'] is False
          assert e['status']=='COLLECTED_FROM_AUTHORITATIVE_RUNTIME' and e['bridge_freshness_limit_seconds']==300
          assert e['collector']['workflow']=='PRJ-004 G12F-R1 Atomic Same-SHA Acceptance'
          assert e['collector']['acceptance_refresh']=='G12F_R1_ATOMIC'
          assert e['selftest']['gate_pass'] and e['selftest']['verified_count']==9 and e['selftest']['total_sources']==9
          assert e['selftest']['schema_pass'] and e['selftest']['freshness_pass'] and e['selftest']['zero_false_verified']
          assert e['selftest']['anonymous_session_denied'] and e['selftest']['c2_denied']
          assert len(e['source_projection'])==9 and {x['authority_id'] for x in e['source_projection']}==set(ids)
          assert all(x['verification_state']=='VERIFIED_AT_COLLECTION' for x in e['source_projection'])
          collected=datetime.datetime.fromisoformat(e['collected_at'].replace('Z','+00:00'))
          now=datetime.datetime.now(datetime.timezone.utc)
          age=(now-collected).total_seconds()
          assert 0 <= age <= 300, f'Atomic evidence stale: {age}s'
          assert m['slice_id']=='G12-NORMALIZED-RUNTIME-ADAPTER-001'
          assert m['candidate_runtime_url']==r['runtime']['url']
          assert m['promotion_requested'] is False and m['protected_domains_touched']==[]
          assert r['promotion_requested'] is False and r['runtime']['production_binding'] is False
          assert e['production_promotion'] is False
          print('G10_CONTRACT_CONFORMANCE=PASS')
          print('G11_IMMUTABLE_BINDING_REGRESSION=PASS')
          print('G12_CONTRACT_BINDING=PASS')
          print('G12_FRESH_9_OF_9=PASS')
          print('G12_ZERO_FALSE_VERIFIED=PASS')
          print(f'G12F_R1_EVIDENCE_AGE_SECONDS={age:.1f}')
          PY

      - name: Execute G08 locked-baseline guard logic on acceptance SHA
        run: |
          test "$(git rev-parse HEAD)" = "${ACCEPT_SHA}"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/${BASELINE_REF}:refs/remotes/origin/${BASELINE_REF}
          test "$(git rev-parse refs/remotes/origin/main)" = "${BASELINE_SHA}"
          test "$(git rev-parse refs/remotes/origin/${BASELINE_REF})" = "${BASELINE_SHA}"
          git merge-base --is-ancestor "${BASELINE_SHA}" "${ACCEPT_SHA}"
          test "$(git rev-parse ${BASELINE_SHA}:index.html)" = "${LOCKED_LAUNCHER_BLOB}"
          test "$(git rev-parse ${BASELINE_SHA}:.c3l/dashboard3/G06A_PRODUCTION_ENTRYPOINT_CONTRACT.v1.json)" = "${LOCKED_G06A_BLOB}"
          git diff --name-status "${BASELINE_SHA}...${ACCEPT_SHA}" | tee /tmp/g12f-r1/G08_BASELINE_TO_CANDIDATE_DELTA.txt
          python - <<'PY'
          import json, os
          from urllib.parse import urlparse
          baseline=os.environ['BASELINE_SHA']
          contract=json.load(open('.c3l/dashboard3/G08_LOCKED_BASELINE_REENTRY_CONTRACT.v1.json',encoding='utf-8'))
          schema=json.load(open('.c3l/dashboard3/G08_SLICE_MANIFEST_SCHEMA.v1.json',encoding='utf-8'))
          manifest=json.load(open('.c3l/dashboard3/G08_CURRENT_SLICE_MANIFEST.v1.json',encoding='utf-8'))
          assert contract['status']=='LOCKED_REENTRY_CONTRACT'
          assert contract['locked_baseline']['production_commit_sha']==baseline
          assert contract['locked_baseline']['launcher_blob_sha']==os.environ['LOCKED_LAUNCHER_BLOB']
          assert contract['locked_baseline']['runtime_snapshot_version']=='1787752423174'
          assert schema['properties']['baseline_sha']['const']==baseline
          assert manifest['project_id']=='PRJ-004' and manifest['contract_version']=='1.0'
          assert manifest['baseline_sha']==baseline and manifest['candidate_sha_source']=='GITHUB_SHA'
          assert manifest['candidate_branch']==os.environ['GITHUB_REF_NAME']
          candidate=urlparse(manifest['candidate_runtime_url'])
          assert candidate.scheme=='https' and candidate.netloc.endswith('.v2.appdeploy.ai')
          core={'baseline_ancestry','delta','security','authority','launcher_runtime','anonymous_fail_closed','hostile_input','runtime_9_of_9','security_negatives','rollback'}
          assert core.issubset(set(manifest['required_proofs']))
          assert all(v=='REQUIRED_PASS' for v in manifest['required_proofs'].values())
          changed=[]
          for line in open('/tmp/g12f-r1/G08_BASELINE_TO_CANDIDATE_DELTA.txt',encoding='utf-8'):
              parts=line.rstrip('\n').split('\t')
              if len(parts)>=2: changed.append(parts[-1])
          actual=set()
          for domain,items in contract['protected_domains'].items():
              for item in items:
                  if item in changed: actual.add(domain)
          assert actual==set(manifest['protected_domains_touched'])
          assert manifest['promotion_requested'] is False
          print('G08_BASELINE_REF_EXACT=PASS')
          print('G08_BASELINE_ANCESTRY=PASS')
          print('G08_BASELINE_BLOBS=PASS')
          print('G08_DELTA_CLASSIFICATION=PASS')
          print('G08_PROMOTION_REQUESTED=FALSE')
          PY

      - name: Browser G08 production non-degradation proof
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const hostile=process.env.PRODUCTION_URL+'?key=SHOULD_NOT_FORWARD&next=https%3A%2F%2Fevil.example%2F%23x#SHOULD_NOT_FORWARD';
            await page.goto(hostile,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForURL(process.env.SOURCE_URL,{timeout:30000});
            const finalUrl=page.url();
            if(finalUrl!==process.env.SOURCE_URL)throw new Error('G08_RUNTIME_BINDING_'+finalUrl);
            if(finalUrl.includes('key=')||finalUrl.includes('next=')||finalUrl.includes('#'))throw new Error('G08_HOSTILE_INPUT_FORWARDED_'+finalUrl);
            await page.waitForFunction(()=>document.querySelector('#preflightState')?.textContent==='PASS' && document.querySelector('#preflightSources')?.textContent==='9 / 9' && document.querySelector('#preflightSecurity')?.textContent==='Security negatives: PASS' && document.querySelector('#sessionState')?.textContent==='ANONYMOUS · ACCESS DENIED',null,{timeout:30000});
            console.log('G08_LAUNCHER_RUNTIME_BINDING=PASS');
            console.log('G08_RUNTIME_9_OF_9=PASS');
            console.log('G08_SECURITY_NEGATIVES=PASS');
            console.log('G08_ANONYMOUS_FAIL_CLOSED=PASS');
            console.log('G08_HOSTILE_INPUT_CONTAINMENT=PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Browser G12 real-data + G11 interaction + G10 runtime conformance
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:800}});
            const sourceRuntimeRequests=[]; const writes=[];
            page.on('request',r=>{if(r.url().includes('c3l-dashboard-prj-004-g04-runtime-candidate'))sourceRuntimeRequests.push(r.url());if(!['GET','HEAD','OPTIONS'].includes(r.method()))writes.push(r.method()+' '+r.url())});
            await page.goto(process.env.G12_URL,{waitUntil:'networkidle',timeout:30000});
            await page.waitForFunction(()=>document.querySelector('[data-testid="binding-mode"]')?.textContent==='REAL_READ_ONLY_EVIDENCE_BRIDGE',null,{timeout:30000});
            const text=async id=>(await page.getByTestId(id).textContent()||'').trim();
            if(await text('authority-count')!=='9 / 9 authorities')throw new Error('AUTHORITY_9_OF_9_FAIL_'+await text('authority-count'));
            if(await text('adapter-state')!=='Adapter: PASS')throw new Error('ADAPTER_NOT_PASS_'+await text('adapter-state'));
            const freshness=await text('bridge-freshness');
            if(!['Evidence: FRESH','Evidence: AGING'].includes(freshness))throw new Error('BRIDGE_STALE_'+freshness);
            for(const id of ['SYS-01','INT-01','SEC-01','REP-03','UNI-03'])if(await text('state-'+id)!=='PASS')throw new Error('EXPECTED_PASS_'+id+'_'+await text('state-'+id));
            for(const id of ['MOD-02','ROU-01','EVA-01','ALT-02']){if(await text('state-'+id)!=='UNKNOWN')throw new Error('ZERO_FALSE_VERIFIED_'+id+'_'+await text('state-'+id));if((await page.getByTestId('state-'+id).getAttribute('class')||'').includes('pass'))throw new Error('UNKNOWN_GREEN_'+id)}
            if(!(await page.getByTestId('oa-boundary').textContent()||'').includes('OWNERSHIP BOUNDARY — VIEW ONLY'))throw new Error('OA_BOUNDARY_LABEL_FAIL');
            const before=await text('state-INT-01');
            await page.getByTestId('card-INT-01').getByRole('button',{name:/Evidence/}).click();
            const lite=await page.getByTestId('evidence-drawer').textContent();
            if(!lite?.includes('READ_ONLY_PUBLIC_AGGREGATE'))throw new Error('AGGREGATE_PERMISSION_NOT_VISIBLE');
            await page.getByRole('button',{name:'Close evidence'}).click();
            await page.getByTestId('mode-switch').getByRole('button',{name:'Full'}).click();
            if(await text('state-INT-01')!==before)throw new Error('LITE_FULL_STATE_DRIFT');
            await page.getByTestId('card-INT-01').getByRole('button',{name:/Evidence/}).click();
            const full=await page.getByTestId('evidence-drawer').textContent();
            if(full!==lite)throw new Error('LITE_FULL_EVIDENCE_DRIFT');
            await page.getByRole('button',{name:'Close evidence'}).click();
            if(await page.locator('[data-testid^="source-PRJ004-AUTH-"]').count()!==9)throw new Error('SOURCE_MAP_NOT_9');
            if(!(await page.getByTestId('module-detail-redacted').textContent()||'').includes('READ-ONLY DETAIL HIDDEN'))throw new Error('MODULE_PERMISSION_HIDE_FAIL');
            if(!(await page.getByTestId('alert-detail-redacted').textContent()||'').includes('ALERT DETAIL HIDDEN'))throw new Error('ALERT_PERMISSION_HIDE_FAIL');
            const buttons=(await page.getByRole('button').allTextContents()).join(' ').toLowerCase();
            for(const bad of ['change route','deploy','rollback','mutate','override severity'])if(buttons.includes(bad))throw new Error('FORBIDDEN_CONTROL_'+bad);
            if(sourceRuntimeRequests.length)throw new Error('DIRECT_SOURCE_RUNTIME_FETCH_'+sourceRuntimeRequests.join(','));
            if(writes.length)throw new Error('BROWSER_WRITE_REQUEST_'+writes.join(','));
            await page.screenshot({path:'/tmp/g12f-r1/g12-real-data-desktop.png',fullPage:true});

            const fail=await browser.newPage({viewport:{width:1280,height:800}});
            await fail.route('**/*',async route=>{const u=route.request().url();if(u.includes('normalized-runtime'))return route.fulfill({status:500,contentType:'application/json',body:'{"error":"simulated_adapter_failure"}'});return route.continue()});
            await fail.goto(process.env.G12_URL,{waitUntil:'networkidle',timeout:30000});
            await fail.waitForFunction(()=>document.querySelector('[data-testid="adapter-state"]')?.textContent==='Adapter: BLOCKED',null,{timeout:30000});
            const ftext=async id=>(await fail.getByTestId(id).textContent()||'').trim();
            if(await ftext('state-SYS-01')!=='UNKNOWN'||await ftext('state-SEC-01')!=='UNKNOWN'||await ftext('boundary-state')!=='BLOCKED')throw new Error('FAIL_CLOSED_RENDER_FAIL');
            if((await fail.getByTestId('state-SYS-01').getAttribute('class')||'').includes('pass'))throw new Error('FAIL_CLOSED_GREEN');
            await fail.getByTestId('card-SYS-01').getByRole('button',{name:/Evidence/}).click();
            if(!(await fail.getByTestId('evidence-drawer').textContent()||'').includes('NOT_PROVEN'))throw new Error('FAIL_CLOSED_EVIDENCE_SYNTHESIS');

            const mobile=await browser.newPage({viewport:{width:375,height:667}});
            await mobile.goto(process.env.G12_URL,{waitUntil:'networkidle',timeout:30000});
            await mobile.waitForFunction(()=>document.querySelector('[data-testid="adapter-state"]')?.textContent==='Adapter: PASS',null,{timeout:30000});
            await mobile.getByTestId('mode-switch').getByRole('button',{name:'Full'}).click();
            await mobile.getByTestId('card-INT-01').getByRole('button',{name:/Evidence/}).click();
            const box=await mobile.getByTestId('evidence-drawer').boundingBox();
            if(!box||box.width>375||box.x<0||box.x+box.width>375.5)throw new Error('MOBILE_DRAWER_OVERFLOW');
            if(!(await mobile.getByTestId('oa-boundary').textContent()||'').includes('OWNERSHIP BOUNDARY — VIEW ONLY'))throw new Error('MOBILE_OA_BOUNDARY_FAIL');
            await mobile.screenshot({path:'/tmp/g12f-r1/g12-real-data-mobile.png',fullPage:true});
            console.log('G12_BROWSER_PASS=PASS');
            console.log('G12_AUTHORITY_9_OF_9=PASS');
            console.log('G12_FIXTURE_REAL_SEMANTIC_PARITY=PASS');
            console.log('G12_FRESHNESS_EVIDENCE_PROPAGATION=PASS');
            console.log('G12_PERMISSION_AWARE_VISIBILITY=PASS');
            console.log('G12_ZERO_FALSE_VERIFIED=PASS');
            console.log('G12_FAIL_CLOSED=PASS');
            console.log('G12_OA_BOUNDARY=PASS');
            console.log('G11_UI_INTERACTION_REGRESSION=PASS');
            console.log('G10_RUNTIME_CONFORMANCE=PASS');
            console.log('G12_BROWSER_WRITE_REQUESTS=0_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Final atomic same-SHA lock and promotion check
        run: |
          test "$(git rev-parse HEAD)" = "${ACCEPT_SHA}"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "${REMOTE_SHA}" = "${ACCEPT_SHA}"
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "${MAIN_SHA}" = "${BASELINE_SHA}"
          python - <<'PY'
          import json, datetime
          e=json.load(open('.c3l/dashboard3/G12_APPDEPLOY_RUNTIME_EVIDENCE.v1.json',encoding='utf-8'))
          m=json.load(open('.c3l/dashboard3/G08_CURRENT_SLICE_MANIFEST.v1.json',encoding='utf-8'))
          r=json.load(open('.c3l/dashboard3/G12_NONPROD_RUNTIME_BINDING.v1.json',encoding='utf-8'))
          assert e['production_promotion'] is False
          assert m['promotion_requested'] is False
          assert r['promotion_requested'] is False and r['runtime']['production_binding'] is False
          age=(datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(e['collected_at'].replace('Z','+00:00'))).total_seconds()
          assert age <= 300, f'Acceptance exceeded freshness window: {age}s'
          print('G12F_R1_FRESH_AT_FINAL_LOCK=PASS')
          print('G12F_R1_PRODUCTION_PROMOTION=FALSE')
          PY
          printf 'acceptance_sha=%s\nmain_sha=%s\npromotion=false\n' "${ACCEPT_SHA}" "${MAIN_SHA}" > /tmp/g12f-r1/final-summary.txt
          echo "G12F_R1_SAME_SHA_ALL_PASS=${ACCEPT_SHA}"
          echo "G12F_R1_MAIN_UNCHANGED=PASS"
          echo "G12F_R1_ATOMIC_ACCEPTANCE=PASS"

      - name: Upload atomic acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: prj004-g12f-r1-atomic-${{ github.run_id }}
          path: /tmp/g12f-r1
          if-no-files-found: error
          retention-days: 30
