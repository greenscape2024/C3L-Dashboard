name: PRJ-004 G18 Post-Pointer Production Readback R2

on:
  push:
    branches:
      - prj-004/g18-postpointer-readback
    paths:
      - .github/workflows/prj004_g18_postpointer_readback_r2.yml

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    env:
      PROD_SHA: d60ee283b7c87b882b406001ba86205ae5714179
      ACCEPTED_REF: authority/prj-004-accepted-production
      PAGES_URL: https://greenscape2024.github.io/C3L-Dashboard/
      V3_URL: https://c3l-dashboard-3-0-g17r-v3-candidate-jpoi50.v2.appdeploy.ai/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock main pointer and launcher
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/${ACCEPTED_REF}:refs/remotes/origin/${ACCEPTED_REF}
          test "$(git rev-parse refs/remotes/origin/main)" = "${PROD_SHA}"
          test "$(git rev-parse refs/remotes/origin/${ACCEPTED_REF})" = "${PROD_SHA}"
          git show refs/remotes/origin/main:index.html | grep -F "${V3_URL}"
          echo G18_R2_REF_LOCK=PASS
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Corrected production browser and fail-closed proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g18-r2
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs');const assert=(c,m)=>{if(!c)throw new Error(m)};
          (async()=>{const b=await chromium.launch({headless:true});const ctx=await b.newContext();const writes=[];ctx.on('request',r=>{const u=r.url(),m=r.method();let p;try{p=new URL(u)}catch{};if(m==='POST'&&p?.origin==='https://api-v2.appdeploy.ai'&&p?.pathname==='/p')return;if(!['GET','HEAD','OPTIONS'].includes(m))writes.push(m+' '+u)});const check=async(url,label)=>{const p=await ctx.newPage();await p.goto(url,{waitUntil:'networkidle',timeout:30000});await p.waitForFunction(()=>document.querySelector('[data-testid="adapter-state"]')?.textContent==='Adapter: PASS',null,{timeout:30000});assert(new URL(p.url()).origin===new URL(process.env.V3_URL).origin,label+'_TARGET');assert(!p.url().includes('evil.example')&&!p.url().includes('token=bad'),label+'_HOSTILE_FORWARD');const t=async id=>(await p.getByTestId(id).textContent()||'').trim();const s={url:p.url(),adapter:await t('adapter-state'),authority:await t('authority-count'),freshness:await t('bridge-freshness'),rep03:await t('state-REP-03'),sys01:await t('state-SYS-01'),sec01:await t('state-SEC-01'),boundary:await t('boundary-state'),binding:await t('binding-mode')};assert(s.authority==='9 / 9 authorities',label+'_AUTH');assert(['Evidence: FRESH','Evidence: AGING'].includes(s.freshness),label+'_FRESH');assert(s.rep03==='PASS',label+'_REP03');assert(s.sys01==='PASS',label+'_SYS01');assert(s.sec01==='PASS',label+'_SEC');assert(s.boundary==='PASS',label+'_OA');assert(s.binding==='ACCEPTED_PRODUCTION_POINTER_READ_ONLY',label+'_BINDING');await p.getByRole('button',{name:'Full'}).click();await p.waitForSelector('[data-testid="full-only"]');s.release=(await p.getByTestId('release-binding').textContent()||'').trim();assert(s.release.includes(process.env.PROD_SHA.slice(0,12)),label+'_RELEASE');await p.close();return s};const canonical=await check(process.env.PAGES_URL+'?g18r2='+Date.now(),'CANONICAL');const hostile=await check(process.env.PAGES_URL+'?next=https://evil.example/#token=bad','HOSTILE');const direct=await check(process.env.V3_URL+'?g18r2='+Date.now(),'DIRECT');assert(writes.length===0,'WRITES');await ctx.close();const fail=await b.newPage();await fail.route('**/*',async route=>route.request().url().includes('normalized-runtime')?route.fulfill({status:500,contentType:'application/json',body:'{"error":"g18_r2_fail_closed"}'}):route.continue());await fail.goto(process.env.V3_URL,{waitUntil:'networkidle',timeout:30000});await fail.waitForFunction(()=>document.querySelector('[data-testid="adapter-state"]')?.textContent==='Adapter: BLOCKED',null,{timeout:30000});const ft=async id=>(await fail.getByTestId(id).textContent()||'').trim();assert(await ft('state-SYS-01')==='UNKNOWN','FAIL_SYS');assert(await ft('state-SEC-01')==='UNKNOWN','FAIL_SEC');assert(await ft('boundary-state')==='BLOCKED','FAIL_BOUNDARY');fs.writeFileSync('/tmp/g18-r2/readback.json',JSON.stringify({canonical,hostile,direct,fail_closed:true,unauthorized_writes:writes.length},null,2)+'\n');await b.close();console.log('G18_R2_REP03=PASS');console.log('G18_R2_SYS01=PASS');console.log('G18_R2_SECURITY=PASS');console.log('G18_R2_OA=PASS');console.log('G18_R2_FAIL_CLOSED=PASS');console.log('G18_R2_HOSTILE_CONTAINMENT=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Final immutable production lock
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/${ACCEPTED_REF}:refs/remotes/origin/${ACCEPTED_REF}
          test "$(git rev-parse refs/remotes/origin/main)" = "${PROD_SHA}"
          test "$(git rev-parse refs/remotes/origin/${ACCEPTED_REF})" = "${PROD_SHA}"
          git show refs/remotes/origin/main:index.html | grep -F "${V3_URL}"
          echo G18_R2_FINAL_LOCK=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: prj004-g18-postpointer-r2-${{ github.run_id }}
          path: /tmp/g18-r2/
          if-no-files-found: error
          retention-days: 30
