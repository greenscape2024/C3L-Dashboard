name: PRJ-004 G08 Successor-Safe Re-entry Guard

on:
  push:
    branches:
      - "prj-004/g08-development-reentry"
      - "prj-004/dev/**"
    paths-ignore:
      - ".c3l/dashboard3/G12_APPDEPLOY_RUNTIME_EVIDENCE.v1.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACCEPTED_REF: authority/prj-004-accepted-production
  PRODUCTION_URL: https://greenscape2024.github.io/C3L-Dashboard/
  RUNTIME_URL: https://c3l-dashboard-3-0-g17r-v3-candidate-jpoi50.v2.appdeploy.ai/

jobs:
  successor-safe-reentry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate with full lineage
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve accepted production baseline dynamically
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/${ACCEPTED_REF}:refs/remotes/origin/${ACCEPTED_REF}
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          BASELINE_SHA="$(git rev-parse refs/remotes/origin/${ACCEPTED_REF})"
          test "${MAIN_SHA}" = "${BASELINE_SHA}"
          git merge-base --is-ancestor "${BASELINE_SHA}" "${GITHUB_SHA}"
          BASELINE_LAUNCHER_BLOB="$(git rev-parse ${BASELINE_SHA}:index.html)"
          MAIN_LAUNCHER_BLOB="$(git rev-parse refs/remotes/origin/main:index.html)"
          test "${BASELINE_LAUNCHER_BLOB}" = "${MAIN_LAUNCHER_BLOB}"
          echo "BASELINE_SHA=${BASELINE_SHA}" >> "$GITHUB_ENV"
          echo "BASELINE_LAUNCHER_BLOB=${BASELINE_LAUNCHER_BLOB}" >> "$GITHUB_ENV"
          echo G08_ACCEPTED_POINTER_RESOLUTION=PASS
          echo G08_MAIN_EQUALS_ACCEPTED=PASS
          echo G08_SUCCESSOR_BASELINE_ANCESTRY=PASS
          echo G08_LAUNCHER_BASELINE_IDENTITY=PASS

      - name: Preserve legacy G08 v1 as historical-only reference
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          c=json.load(open('.c3l/dashboard3/G08_LOCKED_BASELINE_REENTRY_CONTRACT.v1.json',encoding='utf-8'))
          s=json.load(open('.c3l/dashboard3/G08_SLICE_MANIFEST_SCHEMA.v1.json',encoding='utf-8'))
          assert c['gate']=='G-PRJ004-08'
          assert c['version']=='1.0'
          assert c['locked_baseline']['production_commit_sha']=='b7d46b80a72772ebc16bc557500eb63916a1d63c'
          assert s['properties']['baseline_sha']['const']=='b7d46b80a72772ebc16bc557500eb63916a1d63c'
          print('G08_V1_HISTORICAL_REFERENCE_PRESERVED=PASS')
          print('G08_V1_NOT_RUNTIME_BASELINE_AUTHORITY=PASS')
          PY

      - name: Classify accepted-baseline to candidate delta
        run: |
          set -euo pipefail
          git diff --name-status "${BASELINE_SHA}...${GITHUB_SHA}" | tee /tmp/G08_SUCCESSOR_BASELINE_TO_CANDIDATE_DELTA.txt
          test -s /tmp/G08_SUCCESSOR_BASELINE_TO_CANDIDATE_DELTA.txt
          python - <<'PY'
          forbidden_exact={
            'index.html',
            '.c3l/dashboard3/SECURITY_AUTH_CONTRACT.v1.json',
            '.c3l/dashboard3/AUTH_ADAPTER_INTERFACE.v1.js',
            '.c3l/dashboard3/SOURCE_AUTHORITY_REGISTRY.v1.json',
            '.c3l/dashboard3/SOURCE_SCHEMAS.v1.json',
            '.c3l/dashboard3/RUNTIME_BINDING_STATUS.v1.json',
            '.c3l/dashboard3/G03_ACCEPTANCE_RULES.v1.json',
            '.c3l/dashboard3/G06A_PRODUCTION_ENTRYPOINT_CONTRACT.v1.json'
          }
          changed=[]
          for line in open('/tmp/G08_SUCCESSOR_BASELINE_TO_CANDIDATE_DELTA.txt',encoding='utf-8'):
            parts=line.rstrip('\n').split('\t')
            if len(parts)>=2: changed.append(parts[-1])
          touched=sorted(set(changed)&forbidden_exact)
          assert not touched, f'PROTECTED_UI_RUNTIME_AUTHORITY_DELTA={touched}'
          print('G08_SUCCESSOR_DELTA_FILES='+str(len(changed)))
          print('G08_UI_RUNTIME_AUTHORITY_DELTA=0_PASS')
          print('G08_PROTECTED_DOMAIN_DELTA=NONE_PASS')
          PY

      - name: Install browser proof harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Production non-degradation readback
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          const t=async(p,id)=>(await p.getByTestId(id).textContent()||'').trim();
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage();
            await p.goto(process.env.PRODUCTION_URL+'?g20_guard=1&next=https://evil.example/#token=bad',{waitUntil:'networkidle',timeout:30000});
            await p.waitForSelector('[data-testid="adapter-state"]',{timeout:30000});
            assert(new URL(p.url()).origin===new URL(process.env.RUNTIME_URL).origin,'RUNTIME_BINDING_DRIFT');
            assert(!p.url().includes('evil.example')&&!p.url().includes('token=bad'),'HOSTILE_INPUT_FORWARDED');
            assert(await t(p,'adapter-state')==='Adapter: PASS','ADAPTER_NOT_PASS');
            assert(await t(p,'authority-count')==='9 / 9 authorities','AUTHORITY_NOT_9_OF_9');
            assert(['Evidence: FRESH','Evidence: AGING'].includes(await t(p,'bridge-freshness')),'EVIDENCE_NOT_FRESH');
            assert(await t(p,'state-REP-03')==='PASS','REP03_NOT_PASS');
            assert(await t(p,'state-SYS-01')==='PASS','SYS01_NOT_PASS');
            assert(await t(p,'state-SEC-01')==='PASS','SEC01_NOT_PASS');
            assert(await t(p,'boundary-state')==='PASS','OA_NOT_PASS');
            assert(await t(p,'binding-mode')==='ACCEPTED_PRODUCTION_POINTER_READ_ONLY','BINDING_MODE_DRIFT');
            await b.close();
            console.log('G08_PRODUCTION_9_OF_9=PASS');
            console.log('G08_REP03_SYS01_SECURITY_OA=PASS');
            console.log('G08_HOSTILE_INPUT_CONTAINMENT=PASS');
            console.log('G08_PRODUCTION_NON_DEGRADATION=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Fail-closed negative control
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=(c,m)=>{if(!c)throw new Error(m)};const t=async(p,id)=>(await p.getByTestId(id).textContent()||'').trim();
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();await p.route('**/*',async r=>r.request().url().includes('normalized-runtime')?r.fulfill({status:500,contentType:'application/json',body:'{"error":"g20_negative"}'}):r.continue());await p.goto(process.env.RUNTIME_URL,{waitUntil:'networkidle',timeout:30000});await p.waitForFunction(()=>document.querySelector('[data-testid="adapter-state"]')?.textContent==='Adapter: BLOCKED',null,{timeout:30000});assert(await t(p,'state-SYS-01')==='UNKNOWN','SYS01_FALSE_PASS');assert(await t(p,'state-SEC-01')==='UNKNOWN','SEC01_FALSE_PASS');assert(await t(p,'boundary-state')==='BLOCKED','OA_FALSE_PASS');await b.close();console.log('G08_UNKNOWN_NOT_PASS=PASS');console.log('G08_FAIL_CLOSED_NEGATIVE_CONTROL=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Maintenance and promotion policy
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" != "main"
          echo G08_PROMOTION_REQUESTED=FALSE
          echo G08_MAINTENANCE_BY_EXCEPTION_COMPATIBLE=PASS
          echo G08_SUCCESSOR_SAFE_REENTRY_GUARD=PASS

      - name: Upload successor-safe delta evidence
        uses: actions/upload-artifact@v4
        with:
          name: prj004-g08-successor-safe-delta-${{ github.sha }}
          path: /tmp/G08_SUCCESSOR_BASELINE_TO_CANDIDATE_DELTA.txt
          if-no-files-found: error
          retention-days: 30
