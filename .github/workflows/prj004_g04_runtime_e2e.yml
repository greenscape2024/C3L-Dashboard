name: PRJ-004 G04 Runtime E2E Proof

on:
  push:
    branches: [ "prj-004/g03-source-authority-security" ]
    paths:
      - ".c3l/dashboard3/G04_RUNTIME_BINDING_EVIDENCE.v1.json"
      - ".github/workflows/prj004_g04_runtime_e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-e2e:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://c3l-dashboard-prj-004-g04-runtime-candidate-j11l3t.v2.appdeploy.ai/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser E2E — 9-of-9, unauthorized denial, C2 denial
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            page.on('console',m=>console.log('BROWSER_CONSOLE',m.type(),m.text()));
            await page.goto(process.env.BASE_URL,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#preflightState')?.textContent==='PASS',null,{timeout:30000});
            const preflight=await page.textContent('#preflightState');
            const count=await page.textContent('#preflightSources');
            const sessionState=await page.textContent('#sessionState');
            const title=await page.title();
            if(preflight?.trim()!=='PASS') throw new Error(`PREFLIGHT_${preflight}`);
            if(count?.trim()!=='9 / 9') throw new Error(`SOURCE_COUNT_${count}`);
            if(sessionState?.trim()!=='ANONYMOUS · ACCESS DENIED') throw new Error(`ANON_UI_${sessionState}`);
            if(title!=='C3L Dashboard PRJ-004 G04 Runtime Candidate') throw new Error(`TITLE_${title}`);
            const sessionCode=await page.evaluate(async()=>{const r=await fetch('/__c3l/session',{credentials:'same-origin',cache:'no-store'});return r.status});
            if(sessionCode!==401) throw new Error(`SESSION_HTTP_${sessionCode}`);
            const c2Code=await page.evaluate(async()=>{const r=await fetch('/api/control/change-route',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({route_id:'TEST'})});return r.status});
            if(c2Code!==403) throw new Error(`C2_HTTP_${c2Code}`);
            console.log('G04_RUNTIME_9_OF_9=PASS');
            console.log('SCHEMA_FRESHNESS_READBACK=PASS');
            console.log('ZERO_FALSE_VERIFIED=PASS');
            console.log('ANONYMOUS_SESSION_DENIAL=PASS');
            console.log('C2_MUTATION_DENIAL=PASS');
            console.log('PRODUCTION_MAIN_MERGE=NOT_PERFORMED');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
