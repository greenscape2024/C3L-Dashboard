name: PRJ-004 G04 Runtime E2E Proof

on:
  push:
    branches: [ "prj-004/g03-source-authority-security" ]
    paths:
      - ".c3l/dashboard3/G04_RUNTIME_BINDING_EVIDENCE.v1.json"
      - ".github/workflows/prj004_g04_runtime_e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-e2e:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://c3l-dashboard-prj-004-g04-runtime-candidate-j11l3t.v2.appdeploy.ai/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser E2E — 9-of-9, exact readback, SDK security denials
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            page.on('console',m=>console.log('BROWSER_CONSOLE',m.type(),m.text()));
            await page.goto(process.env.BASE_URL,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#preflightState')?.textContent==='PASS' && document.querySelector('#preflightSecurity')?.textContent==='Security negatives: PASS',null,{timeout:30000});
            const preflight=(await page.textContent('#preflightState'))?.trim();
            const count=(await page.textContent('#preflightSources'))?.trim();
            const security=(await page.textContent('#preflightSecurity'))?.trim();
            const sessionState=(await page.textContent('#sessionState'))?.trim();
            const hash=await page.getAttribute('#preflightState','data-readback-hash');
            const sessionDenied=await page.getAttribute('#preflightState','data-session-denied');
            const c2Denied=await page.getAttribute('#preflightState','data-c2-denied');
            const title=await page.title();
            if(preflight!=='PASS') throw new Error(`PREFLIGHT_${preflight}`);
            if(count!=='9 / 9') throw new Error(`SOURCE_COUNT_${count}`);
            if(!/^[a-f0-9]{64}$/.test(hash??'')) throw new Error(`READBACK_HASH_${hash}`);
            if(security!=='Security negatives: PASS') throw new Error(`SECURITY_NEGATIVES_${security}`);
            if(sessionDenied!=='true') throw new Error(`SESSION_DENIAL_${sessionDenied}`);
            if(c2Denied!=='true') throw new Error(`C2_DENIAL_${c2Denied}`);
            if(sessionState!=='ANONYMOUS · ACCESS DENIED') throw new Error(`ANON_UI_${sessionState}`);
            if(title!=='C3L Dashboard PRJ-004 G04 Runtime Candidate') throw new Error(`TITLE_${title}`);
            console.log('G04_RUNTIME_9_OF_9=PASS');
            console.log('SCHEMA=PASS');
            console.log('FRESHNESS=PASS');
            console.log('EXACT_READBACK_HASH=PASS');
            console.log('ZERO_FALSE_VERIFIED=PASS');
            console.log('ANONYMOUS_SESSION_DENIAL_VIA_APP_API=PASS');
            console.log('C2_MUTATION_DENIAL_VIA_APP_API=PASS');
            console.log('PRODUCTION_MAIN_MERGE=NOT_PERFORMED');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
