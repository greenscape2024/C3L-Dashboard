name: PRJ-004 G05 Final Merge Readiness

on:
  push:
    branches: [ "prj-004/g03-source-authority-security" ]
    paths:
      - ".github/workflows/prj004_g05_final_merge_readiness.yml"
      - ".c3l/dashboard3/G04_RUNTIME_E2E_RESULT.v1.json"
      - ".c3l/dashboard3/G05_RUNTIME_E2E_RESULT.v1.json"
      - ".c3l/dashboard3/G06A_PRODUCTION_ENTRYPOINT_CONTRACT.v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate committed G04/G05/G06A evidence
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import datetime

          with open('.c3l/dashboard3/G04_RUNTIME_E2E_RESULT.v1.json', encoding='utf-8') as fh:
              g04 = json.load(fh)
          with open('.c3l/dashboard3/G05_RUNTIME_E2E_RESULT.v1.json', encoding='utf-8') as fh:
              g05 = json.load(fh)
          with open('.c3l/dashboard3/G06A_PRODUCTION_ENTRYPOINT_CONTRACT.v1.json', encoding='utf-8') as fh:
              g06a = json.load(fh)

          assert g04['runtime']['url'] == g05['runtime']['url'] == g06a['hosting_model']['runtime_target']
          assert g04['runtime']['app_id'] == g05['runtime']['app_id'] == g06a['hosting_model']['runtime_app_id']
          assert g04['runtime']['production_main_merged'] is False
          assert g05['runtime']['production_main_merged'] is False
          assert g06a['acceptance']['production_main_merge_before_all_pass'] is False

          assert g04['acceptance']['runtime_authorities_9_of_9'] == 'PASS'
          assert g04['acceptance']['schema_validation'] == 'PASS'
          assert g04['acceptance']['freshness'] == 'PASS'
          assert g04['acceptance']['exact_readback_hash_64hex'] == 'PASS'
          assert g04['acceptance']['anonymous_session_denial_via_official_app_api'] == 'PASS'
          assert g04['acceptance']['c2_mutation_denial_via_official_app_api'] == 'PASS'

          assert g05['status'] == 'PASS'
          assert g05['ci']['workflow'] == 'PRJ-004 G05 Final Merge Readiness'
          assert g05['ci']['conclusion'] == 'success'
          assert g05['acceptance']['runtime_authorities_9_of_9'] == 'PASS'
          assert g05['acceptance']['schema_validation'] == 'PASS'
          assert g05['acceptance']['freshness'] == 'PASS'
          assert g05['acceptance']['exact_readback_hash_64hex'] == 'PASS'
          assert g05['acceptance']['anonymous_session_denial_via_official_app_api'] == 'PASS'
          assert g05['acceptance']['c2_mutation_denial_via_official_app_api'] == 'PASS'
          assert g05['acceptance']['positive_authenticated_real_user_session_smoke'] == 'PASS'
          assert g05['acceptance']['g04_runtime_regression'] == 'PASS'
          assert g05['acceptance']['g03_candidate_validation_on_current_branch'] == 'PASS'

          state = g05['positive_authenticated_user_evidence']['state']
          evidence_hash = g05['positive_authenticated_user_evidence']['auth_context_hash']
          completed_at = g05['positive_authenticated_user_evidence']['completed_at']
          assert state == 'PASS · MERGE ELIGIBLE CANDIDATE'
          assert re.fullmatch(r'[a-f0-9]{64}', evidence_hash)
          datetime.fromisoformat(completed_at.replace('Z', '+00:00'))

          assert g05['merge_permission'] == 'ELIGIBLE_IF_G03_CURRENT_HEAD_SUCCESS'
          print('G03_REGRESSION=DELEGATED_TO_BRANCH_VALIDATION')
          print('G04_RUNTIME_REGRESSION=PASS')
          print('G05_POSITIVE_AUTH_EVIDENCE=PERSISTENT_PASS')
          print(f'G05_EVIDENCE_HASH={evidence_hash}')
          print(f'G05_COMPLETED_AT={completed_at}')
          print('PR1_MERGE_PERMISSION=ELIGIBLE_IF_G03_CURRENT_HEAD_SUCCESS')
          print('PRODUCTION_MAIN_MERGE=NOT_PERFORMED')
          PY
