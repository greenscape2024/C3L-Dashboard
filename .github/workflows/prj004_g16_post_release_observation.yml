name: PRJ-004 G16 Post-Release Observation

on:
  push:
    branches:
      - prj-004/g16-new-baseline-reentry

permissions:
  contents: write

concurrency:
  group: prj004-g16-observation
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    env:
      PROD_SHA: dbc763f91efbc68166416a53a003d4dfde20567b
      PROD_URL: https://greenscape2024.github.io/C3L-Dashboard/
      PROD_RUNTIME_URL: https://c3l-dashboard-3-0-g12-runtime-adapter-candidate-snhzg1.v2.appdeploy.ai/
      SOURCE_URL: https://c3l-dashboard-prj-004-g04-runtime-candidate-j11l3t.v2.appdeploy.ai/
      SOURCE_VERSION: '1787752423174'
      EVIDENCE_BRANCH: prj-004/g08-development-reentry
      EVIDENCE_PATH: .c3l/dashboard3/G12_APPDEPLOY_RUNTIME_EVIDENCE.v1.json
      NEW_BASELINE_REF: baseline/prj-004-dashboard-3.0-rc1-dbc763f9
      LAUNCHER_BLOB: 0439d5bab58a630f387803c77f0181722a2fd9f6
    steps:
      - name: Checkout G16 re-entry branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact production baseline preflight
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/${NEW_BASELINE_REF}:refs/remotes/origin/${NEW_BASELINE_REF} \
            +refs/heads/${EVIDENCE_BRANCH}:refs/remotes/origin/${EVIDENCE_BRANCH}
          test "$(git rev-parse refs/remotes/origin/main)" = "${PROD_SHA}"
          test "$(git rev-parse refs/remotes/origin/${NEW_BASELINE_REF})" = "${PROD_SHA}"
          test "$(git rev-parse ${PROD_SHA}:index.html)" = "${LAUNCHER_BLOB}"
          python - <<'PY'
          import os, subprocess
          s=subprocess.check_output(['git','show',os.environ['PROD_SHA']+':index.html'],text=True)
          assert s.count(os.environ['PROD_RUNTIME_URL'])==2
          assert 'URLSearchParams' not in s and 'location.search' not in s and 'location.hash' not in s
          assert 'window.location.replace(FIXED_PRODUCTION_RUNTIME)' in s
          print('G16_BASELINE_EXACT=PASS')
          print('G16_LAUNCHER_BINDING=PASS')
          PY

      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Fresh authoritative 9-of-9 evidence observation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g16
          git checkout -B "${EVIDENCE_BRANCH}" "refs/remotes/origin/${EVIDENCE_BRANCH}"
          node <<'NODE'
          const { chromium }=require('playwright'); const fs=require('fs');
          const authorities=[
            ['PRJ004-AUTH-BASELINE-INTEGRITY-001','baseline_integrity','ORGANIZATOR_CONTROL_PLANE',300],
            ['PRJ004-AUTH-DRIFT-001','drift','ORGANIZATOR_CONTROL_PLANE',300],
            ['PRJ004-AUTH-SECURITY-RBAC-001','security_rbac','SECURITY_CONTROL_PLANE',60],
            ['PRJ004-AUTH-MODULE-GRAPH-001','module_registry_graph','ORGANIZATOR_CONTROL_PLANE',300],
            ['PRJ004-AUTH-ROUTING-001','routing','ORGANIZATOR_CONTROL_PLANE',60],
            ['PRJ004-AUTH-SNAPSHOT-001','snapshots','ORGANIZATOR_CONTROL_PLANE',0],
            ['PRJ004-AUTH-ALERTS-001','alerts','ALERT_EVENT_CONTROL_PLANE',60],
            ['PRJ004-AUTH-BOUNDARY-001','organizator_agent_boundary','DUAL_BOUNDARY_CONTROL_ORGANIZATOR_AGENT',300],
            ['PRJ004-AUTH-EVALUATION-HISTORY-001','evaluation_history','AGENT_EVALUATION_CONTROL_PLANE',300]
          ];
          (async()=>{const browser=await chromium.launch({headless:true});const p=await browser.newPage({viewport:{width:1280,height:800}});await p.goto(process.env.SOURCE_URL,{waitUntil:'domcontentloaded',timeout:30000});await p.waitForFunction(()=>document.querySelector('#preflightState')?.textContent==='PASS'&&document.querySelector('#preflightSources')?.textContent==='9 / 9'&&document.querySelector('#preflightSecurity')?.textContent==='Security negatives: PASS',null,{timeout:30000});const selftest=await p.evaluate(()=>{const state=document.querySelector('#preflightState'),count=document.querySelector('#preflightSources'),security=document.querySelector('#preflightSecurity');return{gate_pass:state?.textContent==='PASS',verified_count:Number((count?.textContent||'0 / 9').split('/')[0].trim()),total_sources:Number((count?.textContent||'0 / 9').split('/')[1].trim()),schema_pass:state?.textContent==='PASS',freshness_pass:state?.textContent==='PASS',zero_false_verified:state?.textContent==='PASS',readback_hash:state?.getAttribute('data-readback-hash')||'',anonymous_session_denied:state?.getAttribute('data-session-denied')==='true',c2_denied:state?.getAttribute('data-c2-denied')==='true',security_text:security?.textContent||''}});if(!(selftest.gate_pass&&selftest.verified_count===9&&selftest.total_sources===9&&selftest.schema_pass&&selftest.freshness_pass&&selftest.zero_false_verified&&/^[a-f0-9]{64}$/.test(selftest.readback_hash)&&selftest.anonymous_session_denied&&selftest.c2_denied))throw new Error('SOURCE_NOT_ACCEPTABLE');const collected_at=new Date().toISOString();const source_projection=authorities.map(([authority_id,domain,owner,sla])=>({authority_id,domain,owner,freshness_sla_seconds:sla,verification_state:'VERIFIED_AT_COLLECTION',schema_pass:true,freshness_pass:true,evidence_scope:'AGGREGATE_9_OF_9',evidence_reference:selftest.readback_hash,permission_state:'READ_ONLY_PUBLIC_AGGREGATE'}));const out={project_id:'PRJ-004',gate:'G-PRJ004-12',artifact:'APPDEPLOY_RUNTIME_EVIDENCE_BRIDGE',version:'1.0',status:'COLLECTED_FROM_AUTHORITATIVE_RUNTIME',collected_at,bridge_freshness_limit_seconds:300,source_runtime:{app_id:'c3l-dashboard-prj-004-g04-runtime-candidate-j11l3t',url:process.env.SOURCE_URL,snapshot_version:process.env.SOURCE_VERSION,transport:'OFFICIAL_APPDEPLOY_CLIENT_API_VIA_RENDERED_RUNTIME'},selftest,source_projection,collector:{workflow:'PRJ-004 G16 Post-Release Observation',trigger_sha:process.env.GITHUB_SHA,run_id:process.env.GITHUB_RUN_ID,acceptance_refresh:'G16_OBSERVATION'},production_promotion:true,production_sha:process.env.PROD_SHA};fs.writeFileSync(process.env.EVIDENCE_PATH,JSON.stringify(out,null,2)+'\n');fs.writeFileSync('/tmp/g16/fresh.json',JSON.stringify({collected_at,readback_hash:selftest.readback_hash},null,2)+'\n');console.log('G16_FRESH_9_OF_9=PASS');console.log('G16_FRESH_HASH='+selftest.readback_hash);await browser.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PARENT_SHA="$(git rev-parse HEAD)"
          git add "${EVIDENCE_PATH}"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "${EVIDENCE_PATH}"
          git commit -m "PRJ-004 G16: refresh evidence for post-release observation"
          EVIDENCE_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${PARENT_SHA}"
          test "$(git diff --name-only "${PARENT_SHA}" "${EVIDENCE_SHA}")" = "${EVIDENCE_PATH}"
          FRESH_HASH="$(python -c "import json;print(json.load(open('${EVIDENCE_PATH}'))['selftest']['readback_hash'])")"
          echo "EVIDENCE_SHA=${EVIDENCE_SHA}" >> "$GITHUB_ENV"
          echo "FRESH_HASH=${FRESH_HASH}" >> "$GITHUB_ENV"
          git push origin "HEAD:${EVIDENCE_BRANCH}"
          echo 'G16_EVIDENCE_ONLY_CHILD=PASS'

      - name: Canonical production drift and security observation
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B prj-004/g16-new-baseline-reentry "${GITHUB_SHA}"
          node <<'NODE'
          const { chromium }=require('playwright'); const fs=require('fs'); const assert=(c,m)=>{if(!c)throw new Error(m)};
          async function verify(browser,url,label){const context=await browser.newContext();const writes=[];const direct=[];context.on('request',r=>{const u=r.url(),m=r.method();if(u.includes('c3l-dashboard-prj-004-g04-runtime-candidate'))direct.push(u);let p;try{p=new URL(u)}catch{};if(m==='POST'&&p?.origin==='https://api-v2.appdeploy.ai'&&p?.pathname==='/p')return;if(!['GET','HEAD','OPTIONS'].includes(m))writes.push(m+' '+u)});const page=await context.newPage();await page.goto(url,{waitUntil:'networkidle',timeout:30000});assert(page.url()===process.env.PROD_RUNTIME_URL,label+'_TARGET_'+page.url());await page.waitForFunction(()=>document.querySelector('[data-testid="adapter-state"]')?.textContent==='Adapter: PASS',null,{timeout:30000});assert((await page.getByTestId('authority-count').textContent()||'').trim()==='9 / 9 authorities',label+'_AUTH');const fresh=(await page.getByTestId('bridge-freshness').textContent()||'').trim();assert(['Evidence: FRESH','Evidence: AGING'].includes(fresh),label+'_FRESH_'+fresh);const contextLabel=(await page.locator('p.context').textContent()||'').trim();assert(contextLabel==='PRJ-004 · G12 NON-PRODUCTION',label+'_UI_DEBT_UNEXPECTED_'+contextLabel);assert(direct.length===0,label+'_DIRECT_SOURCE');assert(writes.length===0,label+'_WRITES');await context.close();return contextLabel;}
          (async()=>{const browser=await chromium.launch({headless:true});const canonical=await verify(browser,process.env.PROD_URL,'canonical');const hostile=await verify(browser,process.env.PROD_URL+'?g16=1&next=https%3A%2F%2Fevil.example%2F#NO_FORWARD','hostile');const fail=await browser.newPage();await fail.route('**/*',async route=>{if(route.request().url().includes('normalized-runtime'))return route.fulfill({status:500,contentType:'application/json',body:'{"error":"g16_fail_closed_probe"}'});return route.continue()});await fail.goto(process.env.PROD_RUNTIME_URL,{waitUntil:'networkidle',timeout:30000});await fail.waitForFunction(()=>document.querySelector('[data-testid="adapter-state"]')?.textContent==='Adapter: BLOCKED',null,{timeout:30000});assert((await fail.getByTestId('state-SYS-01').textContent()||'').trim()==='UNKNOWN','FAIL_SYS');assert((await fail.getByTestId('state-SEC-01').textContent()||'').trim()==='UNKNOWN','FAIL_SEC');fs.writeFileSync('/tmp/g16/observation.json',JSON.stringify({status:'PASS',production_sha:process.env.PROD_SHA,evidence_sha:process.env.EVIDENCE_SHA,fresh_hash:process.env.FRESH_HASH,canonical_pages_to_rc1:true,hostile_input_contained:true,authority_9_of_9:true,fail_closed:true,forbidden_application_writes:0,direct_authoritative_source_fetches:0,ui_label_debt:canonical},null,2)+'\n');console.log('G16_PRODUCTION_DRIFT=0');console.log('G16_SECURITY_DRIFT=0');console.log('G16_RUNTIME_9_OF_9=PASS');console.log('G16_UI_LABEL_DEBT=CONFIRMED');await browser.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload G16 observation evidence
        uses: actions/upload-artifact@v4
        with:
          name: prj004-g16-observation-${{ github.run_id }}
          path: /tmp/g16/
          if-no-files-found: error
          retention-days: 30
